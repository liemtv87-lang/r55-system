name: VPS XS Sole Sender Health after same-link deployment
on:
  push:
    paths:
      - .github/workflows/vinahost-xs-single-owner-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify VPS bot active and test message saved
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          curl -fsS http://127.0.0.1:18085/healthz | python3 -c 'import json,sys; s=json.load(sys.stdin); print("XS_VPS_HEALTH="+json.dumps(s,ensure_ascii=False)); assert s["ok"] and s["active"] and s["has_token"]'
          docker exec kq247-lottery-bot python -c 'import json,pathlib; p=pathlib.Path("/data/xs-test-message-20261012.json"); assert p.is_file(); d=json.loads(p.read_text()); assert d.get("chat_id")=="-1004320899120" and int(d.get("message_id",0))>0; print("XS_VPS_TEST_MESSAGE_ID="+str(d["message_id"]))'
          echo 'XS_SINGLE_VPS_SENDER_RUNNING=PASS'
          echo XS_BOT_MOUNT_SUMMARY
          docker inspect -f '{{range .Mounts}}{{.Destination}}{{println}}{{end}}' kq247-lottery-bot
          echo XS_BOT_COMPOSE_SERVICES
          cd /opt/kq247/deployment/football-staging
          docker compose config --services | grep -E 'lottery|group|sales' || true
          echo XS_BOT_DRY_SOURCE
          docker exec kq247-lottery-bot python -c 'import pathlib; p=pathlib.Path("/app/lottery-bot/sender.py"); print("SOURCE_EXISTS",p.exists(),"VPS_INDEX_SUPPORTED","KQ247_LOCKED_INDEX_PATH" in p.read_text())'
          echo XS_SCHEDULER_STATUS
          curl -fsS --max-time 8 http://127.0.0.1:18085/healthz
          VPS
