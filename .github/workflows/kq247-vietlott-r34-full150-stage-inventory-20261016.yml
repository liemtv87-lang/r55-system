name: KQ247 Vietlott R34 150 Stage Snapshot Inventory
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-full150-stage-inventory-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Inspect locked R34 source inputs and new 150-draw stage without mutation
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          for cname in kq247-vietlott-r34-stage-20261015 kq247-vietlott-r34-full150-stage-20261016 kq247-vietlott-vps;do
            echo "KQ247_CONTAINER=$cname"
            docker inspect -f 'IMAGE={{.Config.Image}} RUNNING={{.State.Running}}' "$cname"
            docker exec "$cname" node - <<'JS'
          const fs=require('fs');
          for(const p of ['data/history-mega645.json','data/history-power655.json','data/xsmb200.json','data/snapshot-mega645.json','data/snapshot-power655.json','public/filtered-pool-mega645.json','public/filtered-pool-power655.json','public/filter-context-mega645.json','public/filter-context-power655.json','public/backtest-60.json']){
            if(!fs.existsSync('/app/'+p)){console.log('FILE '+p+' MISSING');continue}
            const sz=fs.statSync('/app/'+p).size;
            try {
              const j=JSON.parse(fs.readFileSync('/app/'+p,'utf8'));
              console.log('FILE '+p+' BYTES '+sz+' '+JSON.stringify({
                records:Array.isArray(j)?j.length:undefined,
                keys:Array.isArray(j?.keys)?j.keys.length:undefined,
                locked:j?.locked,analysis_date:j?.analysis_date,target_date:j?.target_date,version:j?.ruleset_version,
                schema:j?.schema_version,products:Object.keys(j?.products||{}),
                contextKeys:p.includes('filter-context')?Object.keys(j):undefined,
                summaryKeys:p.includes('backtest-60')?Object.keys(j?.verification||{}):undefined
              }));
            }catch(e){console.log('FILE '+p+' PARSE_ERROR '+String(e).slice(0,80))}
          }
          JS
          done
          for endpoint in http://127.0.0.1:18146/health http://127.0.0.1:18147/health http://127.0.0.1:18088/api/state;do
            echo "HTTP $endpoint $(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$endpoint" || true)"
          done
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          test "$before" = "$after"
          echo KQ247_READONLY_INVENTORY_DONE=YES
          VPS
