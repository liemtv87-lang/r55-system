name: R55 HTTPS Client and Legacy Link Probe
on:
  push:
    paths:
      - .github/workflows/r55-client-compat-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate old client, new client HTML and existing auth discovery without changing licenses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,json,ssl
          urls={
            'vps_client':'https://64-120-92-172.sslip.io/client.html',
            'render_old':'https://kq247-football-live.onrender.com/client.html',
            'neon_auth':'https://br-divine-resonance-az0qxt8z-kq247auth.compute.c-3.ap-southeast-1.aws.neon.tech/?action=latest-link&product=football',
            'supabase_auth':'https://wbegdefpdwctolawluzo.supabase.co/functions/v1/tool-customer-api?action=latest-link&product=football',
          }
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'R55 read-only compatibility check/1.0'})
              with urllib.request.urlopen(req,timeout=18,context=ssl.create_default_context()) as r:
                data=r.read(60000);content=r.headers.get('content-type','')
                result={'status':r.status,'final_host':urllib.parse.urlparse(r.url).hostname,'bytes':len(data),'content_type':content.split(';')[0]}
                if name.endswith('client'):result['client_html']='kq247_football_code' in data.decode('utf-8','ignore')
                elif 'json' in content:
                  try:
                    d=json.loads(data)
                    result['ok']=d.get('ok');result['fields']=[k for k in ('latest_url','error','reason') if k in d]
                    if d.get('latest_url'):result['latest_host']=urllib.parse.urlparse(d['latest_url']).hostname
                  except:result['json']='invalid'
                print(name,json.dumps(result))
            except urllib.error.HTTPError as e:print(name,json.dumps({'status':e.code,'error':'http'}))
            except Exception as e:print(name,json.dumps({'error':type(e).__name__,'detail':str(e)[:100]}))
          PY
