name: Download Wix lottery production bundle
on:
  push:
    paths:
      - '.github/workflows/download-wix-production.yml'
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Wix lottery production project
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --connect-timeout 20 -o wix-lottery-production.zip "https://www.wix.com/_api/wixstro-deployments/v1/instant-sites/2bfa787e-7508-43cf-8ddc-2ebaac8dbafe/download.zip"
          unzip -l wix-lottery-production.zip
      - uses: actions/upload-artifact@v4
        with:
          name: wix-lottery-production-current
          path: wix-lottery-production.zip
          retention-days: 1
