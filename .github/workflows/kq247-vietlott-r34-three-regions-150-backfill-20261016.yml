name: KQ247 R34 Three Regions 150 Historical Archive
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-three-regions-150-backfill-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-r34-3region150-verified-archive
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Extend independently confirmed historical XSMB source in isolated VPS archive
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          SHA=b4a04a25d061cb81333369b8609f5ebd7f3e2196
          root=/opt/kq247/vietlott
          src="$root/versions/r34-regions150-$SHA"
          stage="$root/backtest-verified/r34-xsmb150-20261015"
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          key=/opt/kq247/ops/deploy/keys/vietlott_ro_ed25519
          known=/opt/kq247/ops/deploy/keys/github_known_hosts
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o ConnectTimeout=15"
          if ! test -d "$src/.git";then
            temp=$(mktemp -d "$root/versions/.regions150-XXXXXX")
            trap 'rm -rf "$temp"' EXIT
            GIT_TERMINAL_PROMPT=0 git clone --quiet --single-branch --branch main git@github.com:liemtv87-lang/vietlott-auto-hoc.git "$temp/source"
            git -C "$temp/source" checkout --quiet --detach "$SHA"
            test "$(git -C "$temp/source" rev-parse HEAD)" = "$SHA"
            mv "$temp/source" "$src"
            rmdir "$temp"
            trap - EXIT
          fi
          test "$(git -C "$src" rev-parse HEAD)" = "$SHA"
          test -s "$stage/input/data/history-mega645.json"
          test -s "$stage/input/data/history-power655.json"
          test -s "$stage/output/xsmb-verified-150-draws.json"
          mkdir -p "$stage/regions"
          for batch in $(seq 31 38);do
            timeout 200 docker run --rm --cpus=2 --memory=2g --pids-limit=128 --network bridge \
              -e R34_REGION_BATCH=12 -e R34_REGION_PARALLEL=2 \
              -v "$src":/work:ro -v "$stage/input":/archive-input:ro \
              -v "$stage/output":/verified-xsmb:ro \
              -v "$stage/regions":/three-regions-out:rw \
              -w /work --entrypoint node node:22-bookworm scripts/r34-150-three-region-archive.mjs
            echo R34_3REGION_150_FINISHED_BATCH="$batch"
          done
          python3 - "$stage/regions/three-region-verified-150-draws.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          assert j["scope"]=="R34_INDEPENDENT_3_REGIONS_150_DRAWS"
          assert j["regions_verified_distinct"]<=j["xsmb_verified_distinct"]<=j["required_distinct_days"]==300
          for x in j["verified_rows"]:
             assert x["mb_prizes"]==27
             assert x["mt_prizes"]%18==0 and x["mn_prizes"]%18==0
             assert len(x["mt_publishers"])>=2 and len(x["mn_publishers"])>=2
          print("R34_3REGION_150_VERIFIED",j["regions_verified_distinct"],
               "XSMB",j["xsmb_verified_distinct"],"REQUIRED",j["required_distinct_days"])
          PY
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          test "$before" = "$after"
          echo R34_3REGION_150_NO_LIVE_CONTAINER_CHANGE=YES
          VPS
