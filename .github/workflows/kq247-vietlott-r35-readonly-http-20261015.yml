name: KQ247 Vietlott R35 Read-Only Live Health 20261015
on:
  push:
    paths:
      - '.github/workflows/kq247-vietlott-r35-readonly-http-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-vietlott-r35-live-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe VinaHost public endpoint without writes, SSH, or container changes
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          base = 'https://vietlott.64-120-92-172.sslip.io'
          for path in ['/health','/api/automation-status','/api/state','/client.html','/guest-snapshot.html','/filter-context-mega645.json','/filter-context-power655.json','/reduced-pool-mega645.json','/reduced-pool-power655.json']:
              try:
                  req=urllib.request.Request(base+path,headers={'User-Agent':'KQ247-read-only-version-audit/1.0','Range':'bytes=0-8191'})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      code=response.status; body=response.read(8192)
              except urllib.error.HTTPError as exc:
                  code=exc.code; body=exc.read(8192)
              except Exception as exc:
                  print('KQ247_LIVE_CHECK='+json.dumps({'path':path,'error':type(exc).__name__},ensure_ascii=False));continue
              row={'path':path,'http':code}
              if path.endswith('.html'): row['customer_html']=b'CLIENT_MODE' in body or b'B\xe1\xba\xa2N KH\xc3\x81CH' in body
              elif path.endswith('.json') and ('reduced-pool' in path):
                  row['sample_bytes']=len(body)
              else:
                  try:
                      obj=json.loads(body)
                      for key in ('ready','data_ready','status','runtime','ruleset_version','message','error','expected_analysis_date'):
                          if key in obj:row[key]=obj[key]
                      for product in ('mega645','power655'):
                          p=(obj.get('products',{}).get(product,{}) or {})
                          snap=p.get('snapshot',{}) or {}
                          if snap: row[product+'_snapshot']={k:snap.get(k) for k in ('locked','analysis_date','target_date','ruleset_version','reduced_total')}
                  except (ValueError,UnicodeError): row['sample_bytes']=len(body)
              print('KQ247_LIVE_CHECK='+json.dumps(row,ensure_ascii=False))
          PY
