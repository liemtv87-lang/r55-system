name: KQ247 Selfheal Static Safety Test
on:
  push:
    branches: [main]
    paths:
      - ops/selfheal/kq247_selfheal.py
      - ops/selfheal/test_selfheal.py
      - .github/workflows/kq247-selfheal-syntax-safety-20261015.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile ops/selfheal/kq247_selfheal.py
          python3 ops/selfheal/kq247_selfheal.py --help
          python3 -m unittest discover -s ops/selfheal -p 'test_*.py' -v
          python3 - <<'PY'
          import ast,pathlib
          tree=ast.parse(pathlib.Path('ops/selfheal/kq247_selfheal.py').read_text())
          names=[n for n in ast.walk(tree) if isinstance(n,ast.Constant) and isinstance(n.value,str)]
          assert not any(n.value in ('restart','stop','rm') for n in names)
          print('KQ247_SELFHEAL_STATIC_SAFETY=PASS')
          PY
