name: XSMB Stable 316 Algorithm Multi-Runner Replay
on:
  push:
    paths: ['research/xsmb_3lo_stable_diversity_20261013.py','.github/workflows/xsmb-3lo-stable-diversity-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        replica: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_3lo_stable_diversity_20261013.py hybrid
