name: Vietlott R33 VPS Reality Check
on:
  push:
    paths: ['.github/workflows/vietlott-r33-vps-reality-check-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify VinaHost R33 primary state without changing services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}" || { echo 'VPS_SSH_MISSING'; exit 1; }
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          echo VIETLOTT_VPS_CHECK_START
          date -u '+UTC=%F %T'
          docker ps -a --format 'CONTAINER={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}' | grep -i vietlott || true
          for p in /opt/kq247/vietlott /opt/kq247/vietlott/source /opt/kq247/vietlott/persist /opt/kq247/vietlott-r33;do
            if [ -d "$p" ];then echo "VPS_DIR_EXISTS=$p";else echo "VPS_DIR_MISSING=$p";fi
          done
          for port in 18088 18112;do
            for route in /health /healthz /api/state;do
              out="/tmp/kq247-r33-probe-${port}-${route//\//_}.json"
              status=$(curl -sS -L --max-time 14 -o "$out" -w '%{http_code}' "http://127.0.0.1:${port}${route}" || true)
              echo "VPS_PORT_ROUTE port=${port} route=${route} http=${status}"
              if [ "$route" = /api/state ] && [ "$status" = 200 ];then
                python3 - "$out" <<'PY'
          import json,sys
          try:
            s=json.load(open(sys.argv[1]))
            print('R33_STATE_TOP',json.dumps({k:s.get(k) for k in ['ready','generated_at','date','ruleset_version','error','status']},ensure_ascii=False)[:400])
            p=s.get('products') or {}
            for k in ['mega645','power655']:
              v=p.get(k) or {};snap=v.get('snapshot') or {}
              print('R33_PRODUCT',k,json.dumps({x:snap.get(x) for x in ['ruleset_version','reduction_target','full_total','filtered_total','reduced_total','date','generated_at','ready']},ensure_ascii=False)[:500])
              print('R33_PRODUCT_KEYS',k,list(v.keys())[:20])
          except Exception as e:print('R33_STATE_PARSE_ERROR',type(e).__name__,str(e)[:120])
          PY
              fi
            done
          done
          echo VIETLOTT_R33_STATS_AND_EXPORT_METADATA
          docker exec -i kq247-vietlott-vps node <<'JS'
          const fs=require('fs');
          for(const path of ['/app/public/backtest-60.json','/app/public/state.json']){
            try{
              const j=JSON.parse(fs.readFileSync(path,'utf8'));
              console.log('R33_FILE',path,'bytes',fs.statSync(path).size,'keys',Object.keys(j).slice(0,20).join(','));
              if(path.includes('backtest')){
                console.log('R33_BACKTEST_SCHEMA',j.schema_version);
                for(const product of ['mega645','power655']){
                  const p=j.products?.[product]||j[product]||{};
                  console.log('R33_BACKTEST_PRODUCT',product,'keys',Object.keys(p).slice(0,25).join(','));
                  console.log('R33_BACKTEST_SCOPE',product,JSON.stringify(p.filter_scope||{}).slice(0,300));
                  for(const n of ['30','60','150']){
                    const w=p['stats'+n]||{};
                    console.log('R33_BACKTEST_WINDOW',product,n,JSON.stringify({
                      draws_tested:w.draws_tested,winning_draws:w.winning_draws,
                      jackpot:w.prize_counts?.Jackpot??w.prize_counts?.['Jackpot 1'],
                      g1:w.prize_counts?.['Giải nhất'],scope:w.statistics_scope?.mode
                    }));
                  }
                }
              }
              if(path.includes('state')){
                for(const p of ['mega645','power655']){
                  const x=j.products?.[p]||{},snap=x.snapshot||{};
                  console.log('R33_SNAPSHOT',p,JSON.stringify({locked:snap.locked,analysis_date:snap.analysis_date,target_date:snap.target_date,source_draw_date:snap.source_draw_date,locked_at:snap.locked_at,full:snap.filtered_total,reduced:snap.reduced_total}));
                }
              }
            }catch(e){console.log('R33_FILE_ERROR',path,String(e.message).slice(0,100))}
          }
          for(const product of ['mega645','power655']){
            for(const kind of ['filtered','reduced']){
              const path='/app/public/'+kind+'-pool-'+product+'.json';
              try{const fd=fs.openSync(path,'r');const meta=fs.statSync(path);fs.closeSync(fd);
                console.log('R33_POOL_FILE',product,kind,'bytes',meta.size);
              }catch(e){console.log('R33_POOL_MISSING',product,kind,String(e.message).slice(0,100))}
            }
          }
          JS
          echo R33_DEPLOYMENT_SOURCE_CHECK
          docker inspect -f 'R33_DOCKER_IMAGE={{.Config.Image}} MOUNTS={{range .Mounts}}{{.Source}}:{{.Destination}};{{end}} WORKDIR={{.Config.WorkingDir}}' kq247-vietlott-vps
          docker exec -i kq247-vietlott-vps node <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          for(const f of ['/app/scripts/update-data.mjs','/app/scripts/engine.mjs','/app/scripts/locked-reduced-policy.mjs']){
            if(!fs.existsSync(f)){console.log('R33_LIVE_SOURCE_ABSENT',f);continue;}
            const s=fs.readFileSync(f,'utf8');
            console.log('R33_LIVE_SOURCE',f,'sha256',crypto.createHash('sha256').update(s).digest('hex').slice(0,16),'bytes',s.length,
              'has_safe_reuse',s.includes('reusableLockedReducedPool'),'has_R33',s.includes('USER_33_HARD_RULES_PAIR_TOUCH_2026_10_13_R1'));
            if(f.endsWith('engine.mjs')){
              const src=s.split('\\n');
              for(const [i,line] of src.entries()){
                if(line.includes('parityCap=')||line.includes('tensCap=')||line.includes('const HARD_RULES ='))
                  console.log('R33_LIVE_ENGINE_MARKER',i+1,line.slice(0,220));
              }
            }
          }
          JS
          echo R33_FULL_AND_REDUCED_INTEGRITY_BEGIN
          docker exec -i kq247-vietlott-vps node <<'JS'
          const fs=require('node:fs');
          const state=JSON.parse(fs.readFileSync('/app/public/state.json','utf8'));
          const version='USER_33_HARD_RULES_PAIR_TOUCH_2026_10_13_R1';
          for(const product of ['mega645','power655']){
            const full=JSON.parse(fs.readFileSync('/app/public/filtered-pool-'+product+'.json','utf8'));
            const reduced=JSON.parse(fs.readFileSync('/app/public/reduced-pool-'+product+'.json','utf8'));
            const snap=state.products?.[product]?.snapshot;
            const hardMax=product==='mega645'?180000:450000;
            const maxN=product==='mega645'?45:55;
            if(!snap?.locked||snap.ruleset_version!==version)throw Error('SNAPSHOT_LOCK_OR_RULES_INVALID_'+product);
            if(full.ruleset_version!==version||reduced.ruleset_version!==version)throw Error('POOL_VERSION_INVALID_'+product);
            if(full.target_date!==snap.target_date||reduced.target_date!==snap.target_date)throw Error('POOL_TARGET_MISMATCH_'+product);
            if(!Array.isArray(full.keys)||full.keys.length!==snap.filtered_total||full.keys.length!==full.valid_total)throw Error('FULL_COUNT_MISMATCH_'+product);
            if(!Array.isArray(reduced.keys)||reduced.keys.length!==snap.reduced_total||reduced.keys.length!==reduced.valid_total||reduced.keys.length>hardMax)throw Error('REDUCED_COUNT_MISMATCH_'+product);
            let previous=-1;
            for(const encoded of full.keys){
              if(!Number.isSafeInteger(encoded)||encoded<=previous)throw Error('FULL_NOT_SORTED_'+product);
              previous=encoded;
              let n=encoded,last=maxN+1;
              for(let i=0;i<6;i++){
                const x=n%64;n=Math.floor(n/64);
                if(x<1||x>maxN||x>=last)throw Error('INVALID_TICKET_'+product);
                last=x;
              }
            }
            let pos=0,lastSelected=-1;
            for(const encoded of reduced.keys){
              if(encoded<=lastSelected)throw Error('REDUCED_NOT_SORTED_'+product);
              lastSelected=encoded;
              while(pos<full.keys.length&&full.keys[pos]<encoded)pos++;
              if(full.keys[pos]!==encoded)throw Error('REDUCED_NOT_IN_FULL_'+product);
            }
            console.log('R33_FULL_REDUCED_INTEGRITY_PASS',product,'full',full.keys.length,'reduced',reduced.keys.length,'cap',hardMax,'valid_33rule_source',true);
          }
          JS
          echo VIETLOTT_VPS_CHECK_END
          VPS
