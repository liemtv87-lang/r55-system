name: KQ247 Vietlott Nightly 33 Rule Read-only Gate
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/kq247-vietlott-nightly-33-contract.yml']
  # Scheduled GitHub-hosted execution retired; VPS owns recurring runtime.
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify live snapshots, daily refresh, full-only 30 60 150 and both customer/export pages
        run: |
          python3 - <<'PY'
          import urllib.request,json,datetime,zoneinfo
          BASE='https://vietlott.64-120-92-172.sslip.io'
          def read(path,timeout=35):
              with urllib.request.urlopen(urllib.request.Request(BASE+path,headers={'User-Agent':'KQ247-Vietlott-Nightly-ReadOnly','Cache-Control':'no-cache'}),timeout=timeout) as r:
                  if r.status!=200:raise ValueError((path,r.status))
                  return r.read().decode('utf8','replace')
          h=json.loads(read('/health'))
          st=json.loads(read('/api/state'))
          bt=json.loads(read('/backtest-60.json'))
          dw=json.loads(read('/draw-windows.json'))
          auto=json.loads(read('/api/automation-status'))
          now=datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Ho_Chi_Minh'))
          expected=now.date() if now.hour>=19 else now.date()-datetime.timedelta(days=1)
          expected=expected.isoformat()
          assert h.get('ok') and h.get('data_ready') and st.get('ready'),('runner not ready',h.get('status'))
          assert h.get('expected_analysis_date')==expected,('runner timezone/date',h.get('expected_analysis_date'),expected)
          assert bt.get('schema_version')=='R33_USER33_ALL_METHODS_SAME_DAY_30DRAWS_60DRAWS_365D'
          assert dw.get('source')=='FULL_33_RULES_ONLY'
          assert auto.get('ok') and auto.get('schedule_vn')==['19:00','19:10','19:20']
          print('VIETLOTT_NIGHTLY_SCHEDULE=PASS',auto.get('schedule_vn'),'VN',now.strftime('%Y-%m-%d %H:%M'))
          for product,cap in [('mega645',180000),('power655',450000)]:
              snap=st['products'][product]['snapshot']
              assert snap.get('analysis_date')==expected and snap.get('locked') is True,('stale snapshot',product,snap.get('analysis_date'),expected)
              assert snap.get('ruleset_version')=='USER_33_HARD_RULES_PAIR_TOUCH_2026_10_13_R1'
              assert 0<snap.get('reduced_total',0)<=cap
              pr=bt['products'][product]
              assert pr['filter_scope']['mode']=='FULL_33_RULES_ONLY' and pr['filter_scope']['reduction_applied'] is False
              assert not any('reduced_stats' in x for x in pr)
              for n in (30,60,150):
                  row=pr.get('stats'+str(n),{})
                  assert row.get('complete') and row.get('draws_tested')==n,('incomplete 33-rule stats',product,n,row.get('draws_tested'))
              print('VIETLOTT_SNAPSHOT_FRESH',product,'date',expected,'FULL',snap['filtered_total'],'REDUCED',snap['reduced_total'],'CAP',cap)
          for path in ['/','/client.html']:
              html=read(path)
              assert 'exportFull33' in html if path=='/' else 'kq247_vietlott_code' in html
              print('VIETLOTT_UI_OK',path,len(html))
          print('VIETLOTT_NIGHTLY_R33_CONTRACT_PASS')
          PY

  sales_sync:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Ensure Vietlott bot client link and existing license count remain synchronized
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          j=json.load(urllib.request.urlopen('http://127.0.0.1:18087/healthz',timeout=12))
          assert j.get('ok') and j.get('active') and j.get('databaseConfigured') and not j.get('lastError'),'sales bot unhealthy'
          print('R33_SALES_BOT_VPS_ACTIVE=PASS')
          PY
          docker exec -i kq247-sales-bot-primary node --input-type=module <<'JS'
          import pg from 'pg';
          import fs from 'node:fs';
          const worker=fs.readFileSync('/app/worker.mjs','utf8');
          for(const s of ['latest:vietlott','plans:vietlott','myCodes','sendLatestClient','validClientUrl','sales_link_history']){
            if(!worker.includes(s))throw Error('missing sales worker '+s);
          }
          const pool=new pg.Pool({connectionString:process.env.NEON_DATABASE_URL,max:1,connectionTimeoutMillis:12000});
          try{
            const expected='https://vietlott.64-120-92-172.sslip.io/client.html';
            const c=await pool.query("SELECT value FROM public.sales_config WHERE key='client_vietlott_url'");
            const h=await pool.query("SELECT url FROM public.sales_link_history WHERE product='vietlott' AND link_role='client' AND is_current=true");
            if(c.rows.length!==1||c.rows[0].value!==expected||h.rows.length!==1||h.rows[0].url!==expected)
              throw Error('sales customer URL differs from main R33 customer URL');
            const counts=await pool.query("SELECT count(*)::int AS active,count(code_value)::int AS codes,count(*) FILTER (WHERE telegram_user_id IS NOT NULL)::int AS linked FROM public.sales_licenses WHERE product='vietlott' AND status='active'");
            const q=counts.rows[0];
            if(q.active<1||q.active!==q.codes||q.linked!==q.active)throw Error('active licenses missing code or Telegram owner');
            const prices=await pool.query("SELECT duration_days,price_vnd,enabled FROM public.sales_plans WHERE product='vietlott' AND duration_days IN (10,30)");
            const tr=prices.rows.find(x=>x.duration_days===10&&x.enabled);
            const mo=prices.rows.find(x=>x.duration_days===30&&x.enabled);
            if(!tr||Number(tr.price_vnd)!==0||!mo||Number(mo.price_vnd)!==1500000)
              throw Error('Vietlott pricing mismatch');
            console.log('R33_VIETLOTT_BOT_LATEST_LINK=PASS',expected);
            console.log('R33_VIETLOTT_EXISTING_CODES=PASS',q.active,'active; no code values disclosed');
            console.log('R33_VIETLOTT_FREE_MONTHLY=PASS');
          }finally{await pool.end()}
          JS
          VPS
