name: Smoke R55 engine

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke-r55-engine.yml"
      - "extracted-r55/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --no-save wrangler@4.135.0

      - name: Start original R55 worker
        shell: bash
        run: |
          set -euo pipefail
          cd extracted-r55
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --test-scheduled > /tmp/r55-wrangler.log 2>&1 &
          echo $! > /tmp/r55-wrangler.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/r55-wrangler.log
          exit 1

      - name: Verify background Durable Object
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SCAN STATUS ==="
          curl -fsS http://127.0.0.1:8787/api/background/scan-status | tee /tmp/scan-status.json
          echo
          echo "=== RUN NOW ==="
          curl -fsS -X POST -H 'x-cloud-cron: manual' http://127.0.0.1:8787/api/background/run-now | tee /tmp/run-now.json
          echo
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const status=JSON.parse(fs.readFileSync('/tmp/scan-status.json','utf8'));
          const run=JSON.parse(fs.readFileSync('/tmp/run-now.json','utf8'));
          if(!health.ok) throw new Error('health failed');
          if(!status.ok) throw new Error('background status failed');
          if(!run.ok) throw new Error('run-now failed: '+JSON.stringify(run));
          console.log(JSON.stringify({
            health:health.ok,
            build:health.build,
            background:status.ok,
            scanActive:run.scanActive ?? run.phase === 'scan',
            phase:run.phase || null,
            rows:run.rows || 0
          }, null, 2));
          NODE

      - name: Show worker log on failure
        if: failure()
        run: cat /tmp/r55-wrangler.log || true
