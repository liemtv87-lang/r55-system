name: KQ247 R34 150 Draw Verified Historical Coverage Gaps
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-gaps-readonly-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-r34-source-gaps-readonly
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Extend independently confirmed historical XSMB source in isolated VPS archive
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          d=/opt/kq247/vietlott/backtest-verified/r34-xsmb150-20261015
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          python3 - "$d" <<'PY'
          import pathlib,sys,json,datetime
          p=pathlib.Path(sys.argv[1])
          xs=json.loads((p/'output/xsmb-verified-150-draws.json').read_text())
          regions=json.loads((p/'regions/three-region-verified-150-draws.json').read_text())
          xsdates={r['date'] for r in xs['verified_rows']}
          regdates={r['date'] for r in regions['verified_rows']}
          needed=set();byproduct={}
          for product in ('mega645','power655'):
            hist=json.loads((p/f'input/data/history-{product}.json').read_text())
            rows=[r for r in hist if r['date']<='2026-10-15'][-150:]
            src=[(datetime.date.fromisoformat(r['date'])-datetime.timedelta(days=1)).isoformat() for r in rows]
            needed.update(src)
            byproduct[product]={'xsmb_ok':sum(x in xsdates for x in src),
              'three_regions_ok':sum(x in regdates for x in src),
              'xsmb_missing':[x for x in src if x not in xsdates]}
          print('R34_150_VERIFIED_COVERAGE='+json.dumps({'by_product':byproduct,
            'required_distinct':len(needed),'three_region_distinct_verified':len(needed & regdates),
            'missing_xsmb_distinct':sorted(needed-xsdates),
            'regional_archive_failures_count':len(regions.get('failures',{})),
            'regional_missing_first_20':sorted((needed & xsdates)-regdates)[:20],
            'regional_missing_by_month':{mo:sum(x[:7]==mo for x in ((needed & xsdates)-regdates)) for mo in sorted({x[:7] for x in ((needed & xsdates)-regdates)})}},ensure_ascii=False))
          PY
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          test "$before" = "$after"
          echo R34_GAPS_READ_ONLY_NO_MUTATION=YES
          VPS
