name: KQ247 all stations same-draw private snapshot stage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kq247-all-stations-private-snapshot-test-v1.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify 36 individual private predictions with all original prize positions
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e scp -o StrictHostKeyChecking=yes deployment/lottery-vps-daily-staging/{normalize-all-prizes.mjs,previous-station-draw-only.mjs,station-previous-draw-runner.mjs,minhngoc-all-stations.mjs,mtmn-35stations-prior-draw-samples.json,verified-five-stations-full-results-20261014.json,multi-station-locked-reader.mjs,schema-previous-station-locked.sql,persist-previous-station-locked.py,export-previous-station-snapshots.py} root@64.120.92.172:/opt/kq247/lottery-daily-staging/
          sshpass -e ssh -T -o StrictHostKeyChecking=yes root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          ROOT=/opt/kq247/lottery-daily-staging
          for f in normalize-all-prizes.mjs previous-station-draw-only.mjs station-previous-draw-runner.mjs minhngoc-all-stations.mjs; do
           docker run --rm --network none --read-only -v "$ROOT":/stage:ro node:22-alpine node --check "/stage/$f"
          done
          echo ALL_POS_SOURCE_CHECK_PASS
          docker run --rm --network none --cpus 1.5 --memory 600m -v "$ROOT":/stage node:22-alpine node /stage/station-previous-draw-runner.mjs --local-verified
          echo VPS_VERIFIED_SOURCE_SNAPSHOT_COUNTS
          python3 - <<'PY'
          import pathlib,json
          base=pathlib.Path('/opt/kq247/lottery-daily-staging/station-next-private')
          files=list(base.glob('*.json'))
          d={}
          for f in files:
           x=json.loads(f.read_text())
           k=x['region']+'|'+x['station']
           d.setdefault(k,[]).append((x['sourceDate'],f.name))
           assert x.get('allPrizesUsed') and x.get('allPositionsUsed')
           assert x['audit']['coveredPositions']==(107 if x['region']=='mb' else 82)
           assert len(x['dan50'])==50 and len(x['dan60'])==60 and len(x['dan75'])==75 and len(x['three_digit'])==500
           assert all(c[-2:] in x['dan75'] for c in x['three_digit'])
          assert len(d)==36,('expected_36_stations',len(d),list(d))
          for name in ['Cần Thơ','Sóc Trăng','Đồng Nai','Khánh Hòa','Đà Nẵng']:
           matching=[json.loads(p.read_text()) for p in files if json.loads(p.read_text()).get('station')==name]
           assert matching and max(x['sourceDate'] for x in matching)=='2026-10-14',('station_source_not_latest',name)
          print('ALL_36_STATIONS_PRIVATE_SNAPSHOTS_PASS',len(d),len(files))
          PY
          echo POSTGRES_NEW_STATION_LOCK_SCHEMA_ONLY
          python3 -m py_compile "$ROOT/persist-previous-station-locked.py" "$ROOT/export-previous-station-snapshots.py"
          docker exec -i kq247-r55-postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < "$ROOT/schema-previous-station-locked.sql"
          python3 "$ROOT/persist-previous-station-locked.py"
          python3 "$ROOT/export-previous-station-snapshots.py"
          python3 - <<'PY'
          import pathlib,json
          x=json.loads(pathlib.Path('/opt/kq247/lottery-daily-staging/public-locked/station-locked-index.json').read_text())
          assert x['type']=='READ_ONLY_LOCKED_STATION_PREDICTIONS'
          assert len(x['records'])==36,len(x['records'])
          assert len({(r['region'],r['station']) for r in x['records']})==36
          assert sum(r['region']=='mb' for r in x['records'])==1
          assert sum(r['region']=='mt' for r in x['records'])==14
          assert sum(r['region']=='mn' for r in x['records'])==21
          print('ALL_36_VPS_PRIVATE_DATABASE_LOCKS_VERIFIED',len(x['records']))
          PY
          echo VPS_36_READER_PRIVATE_STAGE
          docker run --rm --network none --read-only -v "$ROOT/multi-station-locked-reader.mjs":/app/server.mjs:ro node:22-alpine node --check /app/server.mjs
          if ! docker ps --format '{{.Names}}' | grep -Fxq kq247-xs-36-reader; then
           docker run -d --name kq247-xs-36-reader --restart unless-stopped --network football-staging_default --read-only --security-opt no-new-privileges --cap-drop ALL --cpus 0.5 --memory 160m --pids-limit 80 -v "$ROOT/multi-station-locked-reader.mjs":/app/server.mjs:ro -v "$ROOT/public-locked":/locked:ro node:22-alpine node /app/server.mjs
          fi
          docker run --rm --network football-staging_default node:22-alpine node --input-type=module -e '
          const url="http://kq247-xs-36-reader:3019";
          const j=await(await fetch(url+"/healthz")).json();
          if(!j.ok||j.mb!==1||j.mt!==14||j.mn!==21)throw Error("VIEWER_36_COUNTS_"+JSON.stringify(j));
          for(const r of ["xsmb","xsmt","xsmn"]){
           const x=await fetch(url+"/xoso?region="+r);const s=await x.text();
           if(x.status!==200||!["3 LÔ BẠCH THỦ","2 LÔ KÉP","DÀN ĐỀ 50","DÀN ĐỀ 60","DÀN ĐỀ 75","DÀN 3 CÀNG"].every(t=>s.includes(t)))throw Error("INVALID_STATION_PAGE_"+r);
           console.log("PRIVATE_STATION_PAGE_PASS",r,s.length)
          }
          console.log("ALL_36_REGIONS_PRIVATE_READER_VALIDATED",j);
          '
          echo CADDY_PUBLIC_ROUTE_UNCHANGED
          VPS
