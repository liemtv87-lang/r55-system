name: KQ247 SEO technical audit (independent)
on:
  workflow_dispatch:
  push:
    paths:
      - 'seo-monitor/**'
      - '.github/workflows/seo-hourly-audit.yml'
  schedule:
    - cron: '55 * * * *'
permissions:
  contents: read
concurrency:
  group: kq247-seo-hourly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Audit 17 SEO objectives and technical endpoints
        run: python3 seo-monitor/audit.py
      - name: Add GitHub job summary
        if: always()
        run: |
          if test -f seo-monitor/out/report.md; then cat seo-monitor/out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save hourly audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-hourly-report
          path: seo-monitor/out/
          retention-days: 7
          if-no-files-found: warn
