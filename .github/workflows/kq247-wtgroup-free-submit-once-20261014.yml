name: KQ247 free directory one-time VPS Playwright scout
on:
  push:
    branches: [seo-wtgroup-oneoff-20261014]
    paths:
      - .github/workflows/kq247-wtgroup-free-submit-once-20261014.yml
permissions:
  contents: read
concurrency:
  group: kq247-directory-once-20261014
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Scout five new free Telegram directories with isolated VPS Playwright
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          base=/opt/pwremote/seo-free-directory-batch-20261014
          install -d -m 0755 "$base"
          cat > "$base/scout.py" <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright
          targets=[
            'https://telegramgroups.co/submit',
            'https://www.groupssor.com/',
            'https://www.groupverse.co.in/',
            'https://telegramlobby.com/en/',
            'https://www.telegram-groups.com/',
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
            for target in targets:
              ctx=browser.new_context(viewport={'width':1300,'height':940})
              page=ctx.new_page()
              rec={'target':target}
              try:
                r=page.goto(target,wait_until='domcontentloaded',timeout=22000)
                page.wait_for_timeout(1200)
                rec['status']=r.status if r else None
                rec['url']=page.url
                rec['title']=page.title()
                rec['links']=page.locator('a').evaluate_all("""xs => xs.filter(x=>/submit|add|list your|post your|publish/i.test(x.innerText||'') || /submit|add-group|add-channel|publish/i.test(x.href)).slice(0,12).map(x=>({text:x.innerText.trim().slice(0,60),href:x.href}))""")
                rec['forms']=page.locator('form').evaluate_all("""xs => xs.slice(0,8).map(f=>({action:f.action,method:f.method,fields:[...f.querySelectorAll('input,select,textarea,button')].slice(0,35).map(x=>({tag:x.tagName.toLowerCase(),name:x.name,id:x.id,type:x.type,placeholder:x.placeholder,text:(x.innerText||'').slice(0,50),required:x.required,options:x.tagName==='SELECT'?[...x.options].map(o=>o.text).slice(0,35):undefined}))}))""")
                rec['controls']=page.locator('input,select,textarea,button').evaluate_all("""xs => xs.slice(0,35).map(x=>({tag:x.tagName.toLowerCase(),name:x.name,id:x.id,type:x.type,placeholder:x.placeholder,text:(x.innerText||'').slice(0,50),required:x.required,options:x.tagName==='SELECT'?[...x.options].map(o=>o.text).slice(0,35):undefined}))""")
                rec['body_excerpt']=page.locator('body').inner_text(timeout=4000)[:650].replace('\n',' ')
              except Exception as e:
                rec['error']=str(e)[:300]
              print('KQ247_SCOUT_RESULT',json.dumps(rec,ensure_ascii=False),flush=True)
              ctx.close()
            browser.close()
          PY
          before="$(docker ps -a --format '{{.Names}}' | grep '^kq247-' | sort || true)"
          timeout 220s docker run --rm --init --name kq247-free-dir-scout-once \
            --network bridge --read-only --security-opt no-new-privileges --cap-drop ALL \
            --user pwuser --pids-limit 150 --cpus 0.8 --memory 1200m \
            --shm-size 192m --tmpfs /tmp:rw,nosuid,nodev,size=450m,mode=1777 \
            --tmpfs /home/pwuser:rw,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700 \
            --mount "type=bind,src=$base/scout.py,dst=/app/scout.py,readonly" \
            pwremote/playwright:1.56.0 python3 /app/scout.py
          after="$(docker ps -a --format '{{.Names}}' | grep '^kq247-' | sort || true)"
          test "$before" = "$after"
          echo 'PRODUCTION_CONTAINERS_UNCHANGED=YES'
          echo 'NO_NEW_TIMERS=YES'
          VPS
