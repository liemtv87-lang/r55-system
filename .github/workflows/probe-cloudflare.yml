name: Probe Cloudflare runtimes

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-cloudflare.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe existing endpoints
        shell: bash
        run: |
          set -u
          urls=(
            "https://keo-r55.liemtv87.workers.dev/"
            "https://keo-r55.liemtv87.workers.dev/api/background"
            "https://r55-telegram-bot.liemtv87.workers.dev/"
            "https://r55-telegram-bot.liemtv87.workers.dev/health"
            "https://xsmb-335.pages.dev/"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            code=$(curl -L -sS -o /tmp/body.txt -w "%{http_code}" --max-time 20 "$url" || true)
            echo "HTTP $code"
            head -c 1200 /tmp/body.txt || true
            echo
            echo
          done
