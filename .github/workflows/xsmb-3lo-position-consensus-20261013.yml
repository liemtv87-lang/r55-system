name: XSMB 3-Lotto Position Consensus 500-Day Walkforward
on:
  push:
    paths: ['research/xsmb_3lo_position_consensus_20261013.py','.github/workflows/xsmb-3lo-position-consensus-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [recent, long, stable, momentum]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_3lo_position_consensus_20261013.py ${{ matrix.mode }}
