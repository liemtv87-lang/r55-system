name: KQ247 Vietlott Fix 24-Shard Runner On VPS
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-fix-24shards.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-vietlott-live-deploy
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download pinned R39 server file
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 75 'https://raw.githubusercontent.com/liemtv87-lang/vietlott-auto-hoc/722ad564e8d7d34bf9778aa29e5f1af4a11221f5/snapdeploy-server.mjs' -o /tmp/vietlott-snapdeploy-r39.mjs
          node --check /tmp/vietlott-snapdeploy-r39.mjs
          grep -q 'BACKTEST_SHARDS=24' /tmp/vietlott-snapdeploy-r39.mjs
          grep -q 'R39_VPS_USER32_20261013_BACKTEST_24_SHARDS' /tmp/vietlott-snapdeploy-r39.mjs
          echo R39_SOURCE_VERIFIED=YES
      - name: SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Patch current Vietlott container, verify runtime and retain backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          host=root@64.120.92.172
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          sshpass -e ssh -T "${opts[@]}" "$host" 'mkdir -p /opt/kq247/vietlott/versions && chmod 700 /opt/kq247/vietlott/versions'
          sshpass -e scp "${opts[@]}" /tmp/vietlott-snapdeploy-r39.mjs "$host":/opt/kq247/vietlott/versions/snapdeploy-r39-24shards.mjs
          sshpass -e ssh -T "${opts[@]}" "$host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          name=kq247-vietlott-vps
          test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
          base=/opt/kq247/vietlott/versions
          patch="$base/snapdeploy-r39-24shards.mjs"
          backup="$base/snapdeploy-before-r39-$(date -u +%Y%m%dT%H%M%SZ).mjs"
          docker cp "$name":/app/snapdeploy-server.mjs "$backup"
          test -s "$backup" && test -s "$patch"
          node --check "$patch"
          grep -q 'BACKTEST_SHARDS=24' "$patch"
          restore() {
            echo VIETLOTT_R39_ROLLBACK_START=YES
            docker cp "$backup" "$name":/app/snapdeploy-server.mjs
            docker restart "$name" >/dev/null
          }
          trap restore ERR
          docker cp "$patch" "$name":/app/snapdeploy-server.mjs
          docker exec "$name" node --check /app/snapdeploy-server.mjs
          docker restart "$name" >/dev/null
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS --max-time 8 http://127.0.0.1:18088/health > /tmp/kq247-vietlott-live-health.json; then
              if python3 -c 'import json; j=json.load(open("/tmp/kq247-vietlott-live-health.json")); assert j.get("ok") and "R39_" in j.get("runtime","") and "24_SHARDS" in j.get("runtime","")'; then ok=1;break; fi
            fi
            sleep 2
          done
          test "$ok" -eq 1
          trap - ERR
          echo VIETLOTT_R39_VPS_LIVE=YES
          python3 -c 'import json;j=json.load(open("/tmp/kq247-vietlott-live-health.json"));print("VIETLOTT_RUNTIME="+j["runtime"])'
          echo "VIETLOTT_PREVIOUS_SOURCE_BACKUP=$backup"
          REMOTE
