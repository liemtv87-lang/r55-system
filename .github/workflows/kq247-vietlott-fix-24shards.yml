name: KQ247 Vietlott Fix 24-Shard Runner On VPS
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-fix-24shards.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-vietlott-live-deploy
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Patch existing VPS Vietlott image with rollback and retain durable snapshot
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'REMOTE'
          set -euo pipefail
          name=kq247-vietlott-vps
          test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
          base=/opt/kq247/vietlott/versions
          mkdir -p "$base"
          chmod 700 "$base"
          current=/opt/kq247/vietlott/snapdeploy-server.mjs
          test -s "$current"
          prev="$base/snapdeploy-before-r39-$(date -u +%Y%m%dT%H%M%SZ).mjs"
          docker cp "$name":/app/snapdeploy-server.mjs "$prev"
          test -s "$prev"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/opt/kq247/vietlott/snapdeploy-server.mjs')
          data=path.read_text()
          old="const BACKTEST_SHARDS=48;"
          before="R38_VPS_USER32_20261013_RESUMABLE_48_SHARDS"
          after="R39_VPS_USER32_20261013_BACKTEST_24_SHARDS"
          if data.count(old)!=1 or data.count(before)!=1:
              if "const BACKTEST_SHARDS=24;" in data and after in data:
                  print("VIETLOTT_HOST_ALREADY_R39=YES")
              else:raise RuntimeError('unknown source version; refused to patch')
          else:
              data=data.replace(old,"const BACKTEST_SHARDS=24;").replace(before,after)
              path.write_text(data)
          print("VIETLOTT_HOST_24SHARD_PATCH_VERIFIED=YES")
          PY
          restore(){
            echo VIETLOTT_ROLLBACK=STARTED
            cp "$prev" "$current"
            docker cp "$prev" "$name":/app/snapdeploy-server.mjs
            docker restart "$name" >/dev/null
          }
          trap restore ERR
          docker cp "$current" "$name":/app/snapdeploy-server.mjs
          docker exec "$name" node --check /app/snapdeploy-server.mjs
          docker restart "$name" >/dev/null
          ok=0
          for i in $(seq 1 20); do
             if curl -fsS --max-time 8 http://127.0.0.1:18088/health > /tmp/vietlott-r39-health.json; then
                if python3 -c 'import json; j=json.load(open("/tmp/vietlott-r39-health.json"));assert j.get("ok") and "R39_" in j.get("runtime","") and "24_SHARDS" in j.get("runtime","")'; then ok=1;break;fi
             fi
             sleep 3
          done
          test "$ok" -eq 1
          docker commit "$name" kq247-vietlott-vps:r39-24shards >/dev/null
          trap - ERR
          echo VIETLOTT_R39_LIVE=YES
          python3 -c 'import json; print("VIETLOTT_RUNTIME="+json.load(open("/tmp/vietlott-r39-health.json"))["runtime"])'
          echo "VIETLOTT_SOURCE_BACKUP=$prev"
          echo VIETLOTT_R39_IMAGE_BACKUP_TAG=YES
          REMOTE
