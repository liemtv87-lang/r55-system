name: KQ247 Vietlott R34 150 Corrected Snapshot Replay Stage
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-150-replay-stage-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-r34-replay-stage-same-day
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Replay fully verified 34-rule pools from immutable October 15 source on separate VPS stage
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          expected=c57520eb416b2507b8d6e1079559272aea211bed
          base=/opt/kq247/vietlott/versions/r34-replay-$expected
          source="$base/source"
          inputs="$base/inputs"
          output="$base/output"
          backup=/opt/kq247/vietlott/snapshot-backups/r34-150-replay-$expected
          tag=kq247-vietlott-r34-replay-150:c57520eb416b
          old=kq247-vietlott-r34-stage-20261015
          name=kq247-vietlott-r34-replay-150-stage-20261016
          key=/opt/kq247/ops/deploy/keys/vietlott_ro_ed25519
          known=/opt/kq247/ops/deploy/keys/github_known_hosts
          test -s "$key" && test -s "$known"
          test "$(docker inspect -f '{{.State.Running}}' "$old")" = true
          test "$(docker inspect -f '{{.Config.Image}}' "$old")" = kq247-vietlott-r34-stage:319d54228db7
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o ConnectTimeout=15"
          if test -d "$source/.git"; then
            test "$(git -C "$source" rev-parse HEAD)" = "$expected"
          else
            install -d -m 0755 "$base"
            tmp=$(mktemp -d "$base/.clone-XXXXXX")
            trap 'rm -rf "$tmp"' EXIT
            GIT_TERMINAL_PROMPT=0 git clone --quiet --single-branch --branch main git@github.com:liemtv87-lang/vietlott-auto-hoc.git "$tmp/source"
            test "$(git -C "$tmp/source" rev-parse HEAD)" = "$expected"
            mv "$tmp/source" "$source"
            trap - EXIT
          fi
          echo KQ247_R34_REPLAY_SOURCE_SHA="$expected"
          if ! test -s "$output/r34-replay-report.json";then
            test ! -d "$output" || { echo INCOMPLETE_VERSIONED_REPLAY_DIRECTORY; exit 6; }
            install -d -m 0755 "$inputs/data" "$inputs/public" "$output/data" "$output/public"
            for p in history-mega645.json history-power655.json xsmb200.json snapshot-mega645.json snapshot-power655.json;do
              docker cp "$old:/app/data/$p" "$inputs/data/$p"
              cp "$inputs/data/$p" "$output/data/$p"
            done
            for p in state.json filtered-pool-mega645.json filtered-pool-power655.json filter-context-mega645.json filter-context-power655.json;do
              docker cp "$old:/app/public/$p" "$inputs/public/$p"
            done
            cp -a "$source/public/." "$output/public/"
            docker run --rm --network none --cpus=2 --memory=4g \
              -e R34_SOURCE_COMMIT="$expected" -e R34_INPUT_DIR=/input -e R34_OUTPUT_DIR=/output \
              -v "$source":/work:ro -v "$inputs":/input:ro -v "$output":/output:rw \
              -w /work --entrypoint node node:22-bookworm scripts/replay-r34-locked-inputs.mjs
          fi
          test -s "$output/r34-replay-report.json"
          docker run --rm --network none --cpus=1 --memory=2g -v "$output":/replay:ro --entrypoint node node:22-bookworm -e '
            const fs=require("fs"),p=require("path");
            const b=process.argv[1],j=JSON.parse(fs.readFileSync(p.join(b,"r34-replay-report.json")));
            for(const [product,cap] of [["mega645",180000],["power655",450000]]){
              const v=j.products[product];
              const f=JSON.parse(fs.readFileSync(p.join(b,"public/filtered-pool-"+product+".json")));
              const r=JSON.parse(fs.readFileSync(p.join(b,"public/reduced-pool-"+product+".json")));
              if(f.keys.length!==v.new_full||r.keys.length>cap||r.keys.length!==Math.min(cap,f.keys.length)||new Set(f.keys).size!==f.keys.length)process.exit(10);
              const fullSet=new Set(f.keys); if(r.keys.some(k=>!fullSet.has(k)))process.exit(11);
              console.log("KQ247_R34_REPLAY_VERIFIED="+JSON.stringify({product,old:v.old_full,new:v.new_full,reduced:r.keys.length,delta:v.delta}));
            }
          ' /replay
          install -d -m 0755 "$backup"
          (cd "$output" && sha256sum public/filtered-pool-*.json public/reduced-pool-*.json public/state.json data/snapshot-*.json > "$backup/SHA256SUMS")
          cp "$output/r34-replay-report.json" "$backup/report.json"
          (cd "$output" && sha256sum --check --status "$backup/SHA256SUMS")
          echo KQ247_R34_REPLAY_IMMUTABLE_BACKUP_SHA256=PASS
          if ! docker image inspect "$tag" >/dev/null 2>&1;then
            docker build --quiet -f "$source/deploy/Dockerfile.vps" -t "$tag" "$source" >/dev/null
          fi
          if docker ps -a --format '{{.Names}}' | grep -Fxq "$name";then
            test "$(docker inspect -f '{{.Config.Image}}' "$name")" = "$tag"
            test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
          else
            docker run -d --name "$name" --restart=no --cpus=2 --memory=4g \
              -e VIETLOTT_STAGE_READONLY=1 -e TZ=Asia/Ho_Chi_Minh \
              -v "$output/public":/app/public:ro -v "$output/data":/app/data:ro \
              -p 127.0.0.1:18148:8080 "$tag" >/dev/null
          fi
          for i in $(seq 1 20);do
            if curl -fsS --max-time 5 http://127.0.0.1:18148/health >/dev/null 2>&1;then break;fi
            sleep 2
          done
          for endpoint in / /client.html /guest-snapshot.html /api/state;do
            code=$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18148$endpoint" || true)
            echo "KQ247_R34_REPLAY_HTTP_$endpoint=$code"
            test "$code" = 200
          done
          docker exec -e VIETLOTT_VERIFY_DATE=2026-10-15 "$name" node scripts/vps-release-gate.mjs --stage
          echo KQ247_R34_REPLAY_RELEASE_GATE=PASS_STAGE_ONLY
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | grep -v "^$name|" | sort)
          test "$before" = "$after"
          echo KQ247_R34_REPLAY_EXISTING_CONTAINERS_UNCHANGED=YES
          echo KQ247_R34_REPLAY_PUBLIC_CUTOVER=NOT_PERFORMED
          VPS
