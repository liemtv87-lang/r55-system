name: XSMB 3-Lotto Causal Similarity Analogues
on:
  push:
    paths: ['research/xsmb_3lo_causal_analog_20261013.py','.github/workflows/xsmb-3lo-causal-analog-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [numbers, digits, positions, hybrid]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_3lo_causal_analog_20261013.py ${{ matrix.mode }}
