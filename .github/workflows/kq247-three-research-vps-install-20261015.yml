name: KQ247 Three Separate 10min VPS Researchers
on:
  push:
    branches: [main]
    paths:
      - research-vps/**
      - .github/workflows/kq247-three-research-vps-install-20261015.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-three-research-vps-installer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test each unique engine offline
        run: |
          set -euo pipefail
          python3 -m py_compile research-vps/*.py
          python3 research-vps/common.py
          python3 research-vps/football.py --self-test
          python3 research-vps/football_history_merge.py --self-test
          python3 research-vps/football_bongdalu_500day_fetch.py --self-test
          python3 research-vps/install_football_fetch_timer.py --self-test
          python3 research-vps/xs.py --self-test
          python3 research-vps/vietlott.py --self-test
          python3 research-vps/xsmb_import_2000.py --self-test
          python3 research-vps/vietlott_import_all.py --self-test
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Install isolated research units without altering production containers
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          REMOTE='root@64.120.92.172'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE" 'install -d -m 0755 /opt/kq247/research/bin /opt/kq247/research/inputs; install -d -m 0700 /opt/kq247/research/state'
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o ConnectTimeout=20 research-vps/{common,football,football_history_merge,football_bongdalu_500day_fetch,install_football_fetch_timer,xs,vietlott,report,xsmb_import_2000,vietlott_import_all}.py "$REMOTE:/opt/kq247/research/bin/"
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o ConnectTimeout=20 deployment/football-history/learning/grade-2026-10-11.json "$REMOTE:/opt/kq247/research/inputs/football-grades.json"
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o ConnectTimeout=20 deployment/football-history/learning/summary.json "$REMOTE:/opt/kq247/research/inputs/football-summary.json"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE" 'bash -se' <<'VPS'
          set -euo pipefail
          BASE=/opt/kq247/research
          before="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep -E ' (kq247-|r55-)' | sort || true)"
          for domain in football xs vietlott; do
            python3 -m py_compile "$BASE/bin/$domain.py"
            python3 "$BASE/bin/$domain.py" --self-test
          done
          python3 "$BASE/bin/common.py"
          python3 "$BASE/bin/install_football_fetch_timer.py"
          systemctl start kq247-research-football-fetch.service
          python3 "$BASE/bin/football_history_merge.py" --self-test
          KQ247_RESEARCH_ROOT=$BASE/state python3 "$BASE/bin/football_history_merge.py"
          # Immutable upstream full-prize CSV; reject if its 27 numbers do not align
          # with the 505 trusted archived days. Isolated research only.
          KQ247_RESEARCH_ROOT=$BASE/state python3 "$BASE/bin/xsmb_import_2000.py"
          KQ247_RESEARCH_ROOT=$BASE/state python3 "$BASE/bin/vietlott_import_all.py"
          python3 -c 'import json; r=json.load(open("/opt/kq247/research/state/vietlott-history/audit.json")); assert r["total_draws"]["mega645"]>=1500 and r["total_draws"]["power655"]>=1400'
          python3 -c 'import json; d=json.load(open("/opt/kq247/research/state/xsmb-2000-full27.json")); assert len(d)==2000 and all(len(v)==27 for v in d.values())'
          # SEO must continue alongside research. Never stop, disable or restart SEO timers.
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/etc/systemd/system')
          basedir='/opt/kq247/research'
          domains={'football':('00/10','110%','2000M','KQ247_FOOTBALL_BOOTSTRAP=2000000 KQ247_R55_GRADES=/opt/kq247/research/inputs/football-grades-combined.json'),
                   'xs':('02/10','110%','2200M','KQ247_XS_TRIALS=256 KQ247_XS_HISTORY=/opt/kq247/research/state/xsmb-2000-full27.json'),
                   'vietlott':('04/10','110%','2800M','KQ247_VIETLOTT_DRAWS_PER_CYCLE=64 KQ247_VIETLOTT_DATA=/opt/kq247/research/state/vietlott-history')}
          for d,(minute,cpu,mem,setting) in domains.items():
              service=f"""[Unit]
          Description=KQ247 isolated {d} research
          After=local-fs.target
          [Service]
          Type=oneshot
          WorkingDirectory={basedir}/bin
          Environment=KQ247_RESEARCH_ROOT={basedir}/state
          Environment={setting}
          ExecStart=/usr/bin/python3 {basedir}/bin/{d}.py
          TimeoutStartSec=540
          CPUQuota={cpu}
          MemoryMax={mem}
          Nice=8
          IOWeight=50
          NoNewPrivileges=true
          ProtectSystem=strict
          ReadWritePaths={basedir}/state
          ProtectHome=true
          PrivateTmp=true
          PrivateDevices=true
          PrivateNetwork=true
          """
              timer=f"""[Unit]
          Description=KQ247 {d} independent 10-minute research
          [Timer]
          OnCalendar=*-*-* *:{minute}:00
          AccuracySec=1s
          RandomizedDelaySec=0
          Persistent=true
          Unit=kq247-research-{d}.service
          [Install]
          WantedBy=timers.target
          """
              (root/f'kq247-research-{d}.service').write_text(service)
              (root/f'kq247-research-{d}.timer').write_text(timer)
          for d,calendar,arg in [('hourly','hourly',''),('fourhour','*-*-* 00/4:00:00','--four-hour')]:
              (root/f'kq247-research-{d}.service').write_text(f"""[Unit]
          Description=KQ247 three-research {d} reporting
          [Service]
          Type=oneshot
          WorkingDirectory={basedir}/bin
          Environment=KQ247_RESEARCH_ROOT={basedir}/state
          ExecStart=/usr/bin/python3 {basedir}/bin/report.py {arg}
          TimeoutStartSec=60
          NoNewPrivileges=true
          ProtectSystem=strict
          ReadWritePaths={basedir}/state
          PrivateNetwork=true
          """)
              (root/f'kq247-research-{d}.timer').write_text(f"""[Unit]
          Description=KQ247 {d} research report cadence
          [Timer]
          OnCalendar={calendar}
          RandomizedDelaySec=0
          AccuracySec=1min
          Persistent=true
          Unit=kq247-research-{d}.service
          [Install]
          WantedBy=timers.target
          """)
          PY
          systemctl daemon-reload
          for d in football xs vietlott hourly fourhour; do
            systemctl enable --now "kq247-research-$d.timer"
            systemctl is-active --quiet "kq247-research-$d.timer"
          done
          KQ247_RESEARCH_ROOT=$BASE/state KQ247_FOOTBALL_BOOTSTRAP=20000 KQ247_R55_GRADES=$BASE/inputs/football-grades-combined.json python3 "$BASE/bin/football.py"
          KQ247_RESEARCH_ROOT=$BASE/state KQ247_XS_TRIALS=8 KQ247_XS_HISTORY=$BASE/state/xsmb-2000-full27.json python3 "$BASE/bin/xs.py"
          KQ247_RESEARCH_ROOT=$BASE/state KQ247_VIETLOTT_DRAWS_PER_CYCLE=2 KQ247_VIETLOTT_DATA=$BASE/state/vietlott-history python3 "$BASE/bin/vietlott.py"
          KQ247_RESEARCH_ROOT=$BASE/state python3 "$BASE/bin/report.py"
          after="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep -E ' (kq247-|r55-)' | sort || true)"
          test "$before" = "$after"
          echo 'KQ247_ALL_PRODUCTION_CONTAINERS_UNCHANGED=YES'
          systemctl is-active --quiet kq247-research-football-fetch.timer
          echo 'KQ247_FOOTBALL_500DAY_FETCH_TIMER_ACTIVE=YES'
          echo 'KQ247_THREE_RESEARCH_TIMERS_ACTIVE=YES'
          systemctl list-timers --all --no-pager | grep -E 'kq247-research-(football|xs|vietlott|hourly|fourhour)'
          VPS