name: XSMB Triple Causal Complementarity Oct13
on:
  push:
    paths: ['research/xsmb_3lo_causal_complement_20261013.py','.github/workflows/xsmb-3lo-causal-complement-20261013.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [coverage, consensus, bridge, regime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_3lo_causal_complement_20261013.py ${{ matrix.mode }}
