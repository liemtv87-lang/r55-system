name: KQ247 Vietlott R34 Full Pool 150 Draws HTTP Stage
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-full150-http-stage-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-vietlott-r34-150-stage-only
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Start isolated R34 150-draw stage and probe main/guest/TXT UI (no production mutation)
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          sha=be9266d890fc2af10a67df64b3d5f55f38065212
          key=/opt/kq247/ops/deploy/keys/vietlott_ro_ed25519
          known=/opt/kq247/ops/deploy/keys/github_known_hosts
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o ConnectTimeout=15"
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | grep -E '^kq247-vietlott-(vps|r33-candidate|r34-stage-20261015)\|' | sort || true)
          base=/opt/kq247/vietlott/versions
          src="$base/r34-full150-$sha"
          if test -d "$src/.git";then test "$(git -C "$src" rev-parse HEAD)" = "$sha"
          else
            tmp=$(mktemp -d "$base/.r34-new-XXXXXX")
            trap 'rm -rf "$tmp"' EXIT
            GIT_TERMINAL_PROMPT=0 git clone --quiet --single-branch --branch main git@github.com:liemtv87-lang/vietlott-auto-hoc.git "$tmp/source"
            test "$(git -C "$tmp/source" rev-parse HEAD)" = "$sha"
            mv "$tmp/source" "$src"
            rm -rf "$tmp"
            trap - EXIT
          fi
          tag="kq247-vietlott-r34-full150-stage:${sha:0:12}"
          name=kq247-vietlott-r34-full150-stage-20261016
          echo "KQ247_R34_FULL150_STAGE_SOURCE=$sha"
          docker build -q -f "$src/deploy/Dockerfile.vps" -t "$tag" "$src" >/dev/null
          if docker inspect "$name" >/dev/null 2>&1;then
            test "$(docker inspect -f '{{.Config.Image}}' "$name")" = "$tag"
            test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
          else
            docker run -d --name "$name" --restart=no --cpus=2 --memory=4g -e VIETLOTT_STAGE_READONLY=1 -e TZ=Asia/Ho_Chi_Minh -p 127.0.0.1:18147:8080 "$tag" >/dev/null
          fi
          ok=0
          for t in $(seq 1 15);do
            if curl -fsS --max-time 6 http://127.0.0.1:18147/health >/dev/null;then ok=1;break;fi
            sleep 2
          done
          test "$ok" -eq 1 || { docker logs --tail 60 "$name";exit 4; }
          for path in / /client.html /guest-snapshot.html /health;do
            c=$(curl -sSL --max-time 10 -o /dev/null -w '%{http_code}' "http://127.0.0.1:18147$path")
            echo "KQ247_R34_FULL150_STAGE_HTTP_$path=$c"
            test "$c" = 200
          done
          docker exec "$name" node scripts/r34-full-primary-contract.test.mjs
          echo KQ247_R34_FULL150_STAGE_UI_CONTRACT=PASS
          for p in index.html guest-snapshot.html;do
            docker exec "$name" grep -q 'Thống kê 150 kỳ gần nhất' "/app/public/$p"
          done
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | grep -E '^kq247-vietlott-(vps|r33-candidate|r34-stage-20261015)\|' | sort || true)
          test "$before" = "$after"
          echo KQ247_R34_FULL150_EXISTING_CONTAINERS_UNCHANGED=YES
          echo KQ247_R34_FULL150_STAGE_ONLY=YES
          echo KQ247_R34_FULL150_PUBLIC_CUTOVER=NOT_PERFORMED
          VPS
