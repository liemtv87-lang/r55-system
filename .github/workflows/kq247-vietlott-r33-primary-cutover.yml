name: KQ247 Vietlott R33 verified primary VPS cutover
on:
  push:
    paths: ['.github/workflows/kq247-vietlott-r33-primary-cutover.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-vietlott-r33-primary-cutover
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install SSH support
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Atomically switch only Vietlott primary from R40 to verified R33
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          STAGE=/opt/kq247/vietlott-r33-stage
          BASE=/opt/kq247/vietlott-r33-primary
          IMAGE=kq247-vietlott-r33-candidate:r33-metadata-parity-20261013
          OLD=kq247-vietlott-vps
          ROLLBACK="${OLD}-rollback-$(date -u +%Y%m%d%H%M%S)"
          for f in "$STAGE/public/state.json" "$STAGE/public/filtered-pool-mega645.json" "$STAGE/public/filtered-pool-power655.json" "$STAGE/public/reduced-pool-mega645.json" "$STAGE/public/reduced-pool-power655.json" "$STAGE/data/snapshot-mega645.json" "$STAGE/data/snapshot-power655.json"; do test -s "$f"; done
          test -s "$STAGE/.power-parity-recomputed"
          docker image inspect "$IMAGE" >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' kq247-vietlott-r33-candidate)" = true
          curl -fsS --max-time 15 http://127.0.0.1:18112/api/state >/tmp/kq247-r33-stage-verified.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/kq247-r33-stage-verified.json'))
          assert data.get('ready') is True
          for p,minfull,cap in [('mega645',930732,180000),('power655',5096034,450000)]:
            s=data['products'][p]['snapshot']
            assert s['locked'] and s['ruleset_version']=='USER_33_HARD_RULES_PAIR_TOUCH_2026_10_13_R1'
            assert s['filtered_total']==minfull and s['reduced_total']==cap
            print('PRECUTOVER_VERIFIED',p,'FULL33',minfull,'REDUCED',cap)
          PY
          if [ -e "$BASE/.activated-20261013" ]; then
            echo R33_ALREADY_ACTIVATED
            curl -fsS --max-time 10 http://127.0.0.1:18088/health
            exit 0
          fi
          test "$(docker inspect -f '{{.State.Running}}' "$OLD")" = true
          mkdir -p "$BASE/public" "$BASE/data"
          cp -a "$STAGE/public/." "$BASE/public/"
          cp -a "$STAGE/data/." "$BASE/data/"
          test -s "$BASE/public/state.json"
          OLD_RENAMED=0
          NEW_LAUNCHED=0
          restore(){
            rc=$?
            trap - ERR
            echo "R33_PRIMARY_FAILURE_RESTORING_R40_CODE=$rc"
            if [ "$NEW_LAUNCHED" -eq 1 ]; then docker rm -f "$OLD" >/dev/null 2>&1 || true; fi
            if [ "$OLD_RENAMED" -eq 1 ]; then
              docker rename "$ROLLBACK" "$OLD" || true
              docker start "$OLD" >/dev/null || true
            fi
            exit "$rc"
          }
          trap restore ERR
          docker stop "$OLD" >/dev/null
          docker rename "$OLD" "$ROLLBACK"
          OLD_RENAMED=1
          ADMIN_TOKEN=$(cat "$STAGE/.admin-token")
          docker run -d --name "$OLD" --restart unless-stopped --cpus=3 --memory=7g \
            -e PORT=8080 -e NODE_OPTIONS=--max-old-space-size=6144 \
            -e VIETLOTT_STAGING_MODE=0 -e VIETLOTT_ADMIN_TOKEN="$ADMIN_TOKEN" \
            -v "$BASE/public:/app/public" -v "$BASE/data:/app/data" \
            -p 127.0.0.1:18088:8080 "$IMAGE" >/dev/null
          NEW_LAUNCHED=1
          ready=0
          for attempt in $(seq 1 28); do
            if curl -fsS --max-time 8 http://127.0.0.1:18088/health >/tmp/kq247-r33-primary-health.json &&
               curl -fsS --max-time 15 http://127.0.0.1:18088/api/state >/tmp/kq247-r33-primary-state.json; then
              if python3 - <<'PY'
          import json
          h=json.load(open('/tmp/kq247-r33-primary-health.json'))
          s=json.load(open('/tmp/kq247-r33-primary-state.json'))
          assert h.get('ok') and h.get('data_ready') and s.get('ready')
          assert h.get('runtime')=='R40_VPS_USER33_FULL30_60_150_20261013'
          for p,cap in [('mega645',180000),('power655',450000)]:
            x=s['products'][p]['snapshot']
            assert x['locked'] and x['reduced_total']==cap
          PY
              then ready=1;break;fi
            fi
            sleep 2
          done
          test "$ready" -eq 1
          test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/)" = 200
          test "$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/client.html)" = 200
          printf 'Verified R33 primary, previous Vietlott container retained for rollback: %s\n' "$ROLLBACK" > "$BASE/.activated-20261013"
          trap - ERR
          echo VIETLOTT_R33_PRIMARY_VPS=PASS
          echo VIETLOTT_R33_PRIMARY_PORT=18088
          echo VIETLOTT_R33_PREVIOUS_CONTAINER_RETAINED_STOPPED=YES
          echo VIETLOTT_CUSTOMER_LINKS_UNCHANGED=YES
          VPS
