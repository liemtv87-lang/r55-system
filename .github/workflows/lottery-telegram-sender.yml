name: KQ247 Lottery Telegram Sender (GitHub independent)
on:
  workflow_dispatch:
    inputs:
      region:
        description: "mn / mt / mb"
        required: true
        default: "mn"
        type: choice
        options: [mn, mt, mb]
      phase:
        description: "pre = locked pick / result = verified result summary"
        required: true
        default: "result"
        type: choice
        options: [pre, result]
      dry_run:
        description: "Validate only, without sending Telegram"
        required: true
        default: true
        type: boolean
  push:
    paths:
      - 'lottery-bot/sender.py'
      - '.github/workflows/lottery-telegram-sender.yml'
  schedule:
    # UTC = VN - 7. Runs 16:00–21:59 Vietnamese time each day.
    - cron: '*/10 9-14 * * *'
permissions:
  contents: write
concurrency:
  group: kq247-xs-telegram-single-sender
  cancel-in-progress: false
jobs:
  sender:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (durable send ledger)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Install HTML parser
        run: python3 -m pip install --disable-pip-version-check --quiet beautifulsoup4==4.13.5
      - name: Send after validating locked snapshot and complete draw
        env:
          TELEGRAM_LOTTERY_BOT_TOKEN: ${{ secrets.TELEGRAM_LOTTERY_BOT_TOKEN || secrets.XS_BOT_TOKEN || secrets.TELEGRAM_GROUP_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          BOT_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || '' }}
          BOT_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.phase || '' }}
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '0' }}
        shell: bash
        run: |
          set -o pipefail
          if [ -n "$TELEGRAM_LOTTERY_BOT_TOKEN" ]; then echo "TELEGRAM_TOKEN_PRESENT" ; else echo "TELEGRAM_TOKEN_MISSING"; fi
          python3 lottery-bot/sender.py 2>&1 | tee sender.log
      - name: Save diagnostic log (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lottery-sender-log
          path: sender.log
          retention-days: 3
          if-no-files-found: ignore
