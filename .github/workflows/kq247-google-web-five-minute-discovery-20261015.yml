name: KQ247 Google Web Discovery Every Five Minutes
on:
  push:
    branches: [main]
    paths:
      - seo-vps/kq247-google-web-discovery.py
      - .github/workflows/kq247-google-web-five-minute-discovery-20261015.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-google-web-discovery-installer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Offline safety and inventory checks
        run: |
          python3 -m py_compile seo-vps/kq247-google-web-discovery.py
          python3 seo-vps/kq247-google-web-discovery.py --self-test
      - name: Prepare pinned SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Install and run isolated five-minute Google discovery only
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          mkdir -p -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          REMOTE='root@64.120.92.172'
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            seo-vps/kq247-google-web-discovery.py "$REMOTE:/opt/kq247/google-web-seo/discovery.py"
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE" 'bash -se' <<'VPS'
          set -euo pipefail
          before="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep -E ' (kq247-|r55-)' | sort || true)"
          python3 -m py_compile /opt/kq247/google-web-seo/discovery.py
          python3 /opt/kq247/google-web-seo/discovery.py --self-test
          cat > /etc/systemd/system/kq247-google-web-discovery.service <<'SERVICE'
          [Unit]
          Description=Independent Google WEB SEO Vietnam-first public source discovery
          Wants=network-online.target
          After=network-online.target
          [Service]
          Type=oneshot
          WorkingDirectory=/opt/kq247/google-web-seo
          ExecStart=/usr/bin/flock -n -E 0 /opt/kq247/google-web-seo/discovery.lock /usr/bin/python3 /opt/kq247/google-web-seo/discovery.py
          TimeoutStartSec=250
          NoNewPrivileges=true
          SERVICE
          cat > /etc/systemd/system/kq247-google-web-discovery.timer <<'TIMER'
          [Unit]
          Description=KQ247 dedicated Google WEB source discovery every five minutes
          [Timer]
          OnCalendar=*:0/5
          RandomizedDelaySec=0
          AccuracySec=10s
          Persistent=true
          Unit=kq247-google-web-discovery.service
          [Install]
          WantedBy=timers.target
          TIMER
          systemctl daemon-reload
          systemctl enable --now kq247-google-web-discovery.timer
          systemctl start kq247-google-web-discovery.service
          systemctl is-active --quiet kq247-google-web-discovery.timer
          systemctl is-active --quiet kq247-google-web-seo.timer
          systemctl is-active --quiet kq247-seo-unified.timer
          python3 - <<'PY'
          import json,datetime,pathlib
          f=pathlib.Path('/opt/kq247/deployment/football-original/public/google-web-discovery-status.json')
          assert f.is_file(),f
          d=json.loads(f.read_text())
          assert d['discovery_interval_minutes']==5,d
          assert d['vietnam_priority_enabled'] is True,d
          assert d['source_hosts_examined_this_run']>=40,d
          age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d['checked_at_utc'])).total_seconds()
          assert 0<=age<=450,age
          print("KQ247_FIVE_MINUTE_DISCOVERY_INSTALLED=PASS")
          print("KQ247_GOOGLE_DISCOVERY_LIVE_METRICS="+json.dumps(d,ensure_ascii=False))
          PY
          curl -fsS --max-time 12 http://127.0.0.1:18080/google-web-discovery-status.json | \
            python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["discovery_interval_minutes"]==5;print("KQ247_FIVE_MINUTE_PUBLIC_REPORT=PASS")'
          after="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep -E ' (kq247-|r55-)' | sort || true)"
          test "$before" = "$after"
          echo KQ247_PRODUCTION_CONTAINERS_UNCHANGED=PASS
          echo KQ247_GOOGLE_FIVE_MIN_TIMER_ACTIVE=PASS
          echo KQ247_OTHER_SEO_TIMERS_UNCHANGED=PASS
          systemctl list-timers --all kq247-google-web-discovery.timer kq247-google-web-seo.timer kq247-seo-unified.timer --no-pager
          VPS
