name: KQ247 Sales Migration Readiness
# Recheck payOS credentials after merchant configuration.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/kq247-sales-readiness.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secret names (not values)
        env:
          S1: ${{ secrets.VPS_ROOT_PASSWORD }}
          S2: ${{ secrets.NEON_DATABASE_URL }}
          S3: ${{ secrets.TELEGRAM_SALES_BOT_TOKEN }}
          S4: ${{ secrets.PAYOS_CLIENT_ID }}
          S5: ${{ secrets.PAYOS_API_KEY }}
          S6: ${{ secrets.PAYOS_CHECKSUM_KEY }}
        shell: bash
        run: |
          for x in S1 S2 S3 S4 S5 S6; do
            if [ -n "${!x}" ]; then echo "$x=READY"; else echo "$x=NOT_CONFIGURED"; fi
          done
          if [ -n "$S4" ] && [ -n "$S5" ] && [ -n "$S6" ]; then
            echo KQ247_PAYOS_SECRETS_ALL_PRESENT=YES
          else
            echo KQ247_PAYOS_SECRETS_ALL_PRESENT=NO
          fi

      - name: Check live VPS sales payment flags without displaying private data
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:18087/healthz |
            python3 -c 'import json,sys;d=json.load(sys.stdin); p=d.get("payos") or {};print("VPS_BOT_ACTIVE="+str(bool(d.get("active"))).upper());print("VPS_PAYOS_CREDENTIALS="+str(bool(p.get("credentials"))).upper());print("VPS_PAYOS_WEBHOOK_CONFIRMED="+str(bool(p.get("webhookConfirmed"))).upper());print("VPS_PAYOS_READY="+str(bool(p.get("ready"))).upper())'
          echo VPS_EXISTING_CUSTOMERS_UNCHANGED=YES
          REMOTE

      - name: Probe Render standby PayOS prerequisites without revealing credentials
        shell: bash
        run: |
          set -euo pipefail
          base='https://tool-sales-bot.onrender.com'
          curl --retry 2 --retry-delay 3 --fail --silent --show-error --max-time 85 "$base/healthz" >/tmp/render-sales-health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/render-sales-health.json'))
          p=h.get('payos') or {}
          for key in ('active','tokenConfigured','databaseConfigured'):
              print('RENDER_'+key.upper()+'='+str(bool(h.get(key))).upper())
          for key in ('credentials','publicEndpoint','webhookConfirmed','ready'):
              print('RENDER_PAYOS_'+key.upper()+'='+str(bool(p.get(key))).upper())
          assert h.get('active') is False, 'Render bot must remain standby during readiness check'
          assert h.get('tokenConfigured'), 'Render Telegram token absent'
          assert h.get('databaseConfigured'), 'Render Neon connection missing'
          assert p.get('credentials'), 'Render PayOS credentials absent'
          assert p.get('publicEndpoint'), 'Render HTTPS public origin missing'
          PY
          status=$(curl -sS -o /tmp/render-unsigned-callback.txt -w '%{http_code}' --max-time 85 -X POST -H 'Content-Type: application/json' --data '{}' "$base/payos/webhook")
          echo "RENDER_UNSIGNED_WEBHOOK_HTTP=$status"
          test "$status" = "400"
          curl --fail --silent --show-error --max-time 85 "$base/payos/return" | grep -q 'KQ247'
          echo "RENDER_RETURN_URL=PASS"
          echo "RENDER_STANDBY_VERIFIED=YES"
