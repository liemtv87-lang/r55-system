name: KQ247 Background Backlink Discovery (persistent VPS worker)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kq247-backlink-background-once-20261014.yml', 'scripts/kq247-backlink-background-discovery-20261014.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-backlink-background-once
  cancel-in-progress: false
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate background scanner
        env:
          KQ247_BASE: /tmp/kq247-test
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kq247-backlink-background-discovery-20261014.py
          python3 scripts/kq247-backlink-background-discovery-20261014.py --self-test
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Start persistent VPS background source discovery without touching production
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS" || { echo 'VPS_ROOT_PASSWORD missing'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          REMOTE="sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172"
          $REMOTE 'install -d -m 0700 /opt/pwremote/kq247-backlink-background'
          # Use SFTP-backed SCP for source transfer. Some VPS shells treated
          # streamed gzip bytes as shell input and never extracted the archive.
          sshpass -e scp -q -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            scripts/kq247-backlink-background-discovery-20261014.py \
            root@64.120.92.172:/opt/pwremote/kq247-backlink-background/kq247-backlink-background-discovery-20261014.py
          $REMOTE 'bash -se' <<'VPS'
          set -euo pipefail
          base=/opt/pwremote/kq247-backlink-background
          chmod 0644 "$base/kq247-backlink-background-discovery-20261014.py"
          python3 -m py_compile "$base/kq247-backlink-background-discovery-20261014.py"
          python3 "$base/kq247-backlink-background-discovery-20261014.py" --self-test
          echo "INVENTORY_FILES:"
          for f in "$base/url-inventory.txt" /opt/pwremote/kq247-domain-first/url-inventory.txt; do
            test ! -f "$f" || ls -lh "$f"
          done
          before="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep ' kq247-' | sort || true)"
          pid="$(cat "$base/worker.pid" 2>/dev/null || true)"
          current_sha="$(sha256sum "$base/kq247-backlink-background-discovery-20261014.py" | cut -d' ' -f1)"
          active_sha="$(cat "$base/worker.sha256" 2>/dev/null || true)"
          owned_running=0
          if test -n "$pid" && test -r "/proc/$pid/cmdline" && kill -0 "$pid" 2>/dev/null; then
            cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
            if echo "$cmdline" | grep -Fq "$base/kq247-backlink-background-discovery-20261014.py" && echo "$cmdline" | grep -Fq -- '--watch'; then
              owned_running=1
            fi
          fi
          # Adopt a matching worker when an older launcher left a stale PID file.
          # No arbitrary process kill: require the exact dedicated path and --watch.
          if test "$owned_running" = 0; then
            for candidate in $(pgrep -f 'kq247-backlink-background-discovery-20261014.py' || true); do
              if test -r "/proc/$candidate/cmdline"; then
                verified="$(tr '\\0' ' ' < "/proc/$candidate/cmdline" || true)"
                if [[ "$verified" == *"$base/kq247-backlink-background-discovery-20261014.py"* && "$verified" == *"--watch"* ]]; then
                  owned_running=1
                  pid="$candidate"
                  printf '%s\\n' "$pid" > "$base/worker.pid"
                  echo "KQ247_DISCOVERY_PID_ADOPTED=$pid"
                  break
                fi
              fi
            done
          fi
          if test "$owned_running" = 1 && test "$current_sha" = "$active_sha"; then
            echo "KQ247_WATCH_ALREADY_CURRENT_PID=$pid"
          else
            if test "$owned_running" = 1; then
              echo "KQ247_REPLACING_ONLY_DEDICATED_DISCOVERY_PID=$pid"
              kill "$pid"
              for i in 1 2 3 4 5; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 1
              done
            fi
            cd "$base"
            nohup nice -n 15 python3 -u \
              "$base/kq247-backlink-background-discovery-20261014.py" --watch \
              >>"$base/worker.log" 2>&1 </dev/null &
            echo $! > "$base/worker.pid"
            sleep 4
            if ! kill -0 "$(cat "$base/worker.pid")" 2>/dev/null; then
              echo "Discovery worker failed; recent log:"
              tail -n 60 "$base/worker.log" || true
              exit 1
            fi
            printf '%s\n' "$current_sha" > "$base/worker.sha256"
            echo "KQ247_WATCH_STARTED_PID=$(cat "$base/worker.pid")"
          fi
          echo "KQ247_BACKGROUND_LOG_TAIL:"
          tail -n 12 "$base/worker.log" || true
          if test -f "$base/latest.json"; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/opt/pwremote/kq247-backlink-background/latest.json').read_text())
          print('KQ247_CANDIDATE_FORM_ROUTES',json.dumps(r.get('candidate_forms',[])[:30],ensure_ascii=False))
          print('KQ247_BG_REPORT',json.dumps({k:r.get(k) for k in (
            'url_records_actually_read_total','unique_hosts_discovered',
            'http_hosts_checked_this_run','hosts_by_status',
            'public_backlinks_created_by_scanner','source_inventory_exists')},ensure_ascii=False))
          PY
          fi
          after="$(docker ps -a --no-trunc --format '{{.ID}} {{.Names}}' | grep ' kq247-' | sort || true)"
          test "$before" = "$after"
          echo "KQ247_PRODUCTION_CONTAINERS_UNCHANGED=YES"
          echo "CONTINUOUS_DISCOVERY_WATCH_MODE=YES (idle backoff; no bulk posting in this worker)"
          # Dedicated 5-minute watchdog: recover only this backlink discovery worker.
          # Do not operate on any KQ247 football, lottery or Telegram container.
          cat > "$base/ensure-worker.sh" <<'WATCHDOG'
          #!/usr/bin/env bash
          set -euo pipefail
          base=/opt/pwremote/kq247-backlink-background
          script="$base/kq247-backlink-background-discovery-20261014.py"
          pid="$(cat "$base/worker.pid" 2>/dev/null || true)"
          healthy=0
          if [[ "$pid" =~ ^[0-9]+$ ]] && test -r "/proc/$pid/cmdline"; then
            cmdline="$(tr '\\0' ' ' < "/proc/$pid/cmdline" || true)"
            if [[ "$cmdline" == *"$script"* && "$cmdline" == *"--watch"* ]]; then
              healthy=1
            fi
          fi
          if test "$healthy" -eq 0; then
            for candidate in $(pgrep -f 'kq247-backlink-background-discovery-20261014.py' || true); do
              if test -r "/proc/$candidate/cmdline"; then
                checked="$(tr '\\0' ' ' < "/proc/$candidate/cmdline" || true)"
                if [[ "$checked" == *"$script"* && "$checked" == *"--watch"* ]]; then
                  pid="$candidate"
                  healthy=1
                  printf '%s\\n' "$pid" > "$base/worker.pid"
                  echo "KQ247_DISCOVERY_WATCHDOG_ADOPTED_PID=$pid"
                  break
                fi
              fi
            done
          fi
          if test "$healthy" -eq 0; then
            echo "KQ247_DISCOVERY_WATCHDOG_RECOVERY=starting"
            cd "$base"
            nohup nice -n 15 python3 -u "$script" --watch >>"$base/worker.log" 2>&1 </dev/null &
            pid="$!"
            printf '%s\\n' "$pid" > "$base/worker.pid"
            sleep 3
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "KQ247_DISCOVERY_WATCHDOG_RECOVERY=FAILED"
              exit 1
            fi
          else
            echo "KQ247_DISCOVERY_WATCHDOG_RECOVERY=not_needed"
          fi
          python3 - <<'PY'
          import json,datetime,pathlib,subprocess
          root=pathlib.Path('/opt/pwremote/kq247-backlink-background')
          public=pathlib.Path('/opt/kq247/deployment/football-original/public')
          def report(filename):
              try:
                  o=json.loads((root/filename).read_text())
                  return {k:o.get(k) for k in ('updated_utc','updated_at_utc','unique_hosts_discovered','hosts_by_status','counts','verified_new_public_links')}
              except Exception:return {}
          poster=subprocess.run(['docker','inspect','-f','{{.State.Running}}','seo-kq247-opt-in-directory'],capture_output=True,text=True,timeout=12)
          running=(poster.returncode==0 and poster.stdout.strip()=='true')
          data={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                'discovery_pid':int((root/'worker.pid').read_text().strip()),
                'discovery_status':'running',
                'poster_running':running,
                'scanner':report('latest.json'),
                'submissions':report('bulk-posts.json'),
                'note':'Running is not the same as new eligible listing or verified backlinks. Only public links count.'}
          temp=public/'seo-backlink-worker-status.tmp'
          temp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\\n')
          temp.replace(public/'seo-backlink-worker-status.json')
          print('KQ247_BACKLINK_WATCHDOG_STATUS='+json.dumps({
             'discovery_status':data['discovery_status'],
             'poster_running':running,
             'sources':data['scanner'].get('unique_hosts_discovered'),
             'attempts':data['submissions'].get('counts')},ensure_ascii=False))
          PY
          WATCHDOG
          chmod 0750 "$base/ensure-worker.sh"
          cat > /etc/systemd/system/kq247-backlink-discovery-watchdog.service <<'WATCHDOGSERVICE'
          [Unit]
          Description=KQ247 isolated backlink discovery self-healing worker
          Wants=network-online.target
          After=network-online.target
          [Service]
          Type=oneshot
          ExecStart=/bin/bash /opt/pwremote/kq247-backlink-background/ensure-worker.sh
          TimeoutStartSec=40
          WATCHDOGSERVICE
          cat > /etc/systemd/system/kq247-backlink-discovery-watchdog.timer <<'WATCHDOGTIMER'
          [Unit]
          Description=Verify only the KQ247 SEO background discovery every 5 minutes
          [Timer]
          OnBootSec=2min
          OnUnitInactiveSec=5min
          AccuracySec=30s
          Unit=kq247-backlink-discovery-watchdog.service
          [Install]
          WantedBy=timers.target
          WATCHDOGTIMER
          systemctl daemon-reload
          systemctl enable --now kq247-backlink-discovery-watchdog.timer
          if ! systemctl start kq247-backlink-discovery-watchdog.service; then
            systemctl status --no-pager -l kq247-backlink-discovery-watchdog.service || true
            journalctl -u kq247-backlink-discovery-watchdog.service -n 35 --no-pager || true
            /bin/bash -n "$base/ensure-worker.sh" || true
            exit 1
          fi
          systemctl is-active --quiet kq247-backlink-discovery-watchdog.timer
          test -s /opt/kq247/deployment/football-original/public/seo-backlink-worker-status.json
          echo "KQ247_DISCOVERY_WATCHDOG_ACTIVE=YES"

          VPS
