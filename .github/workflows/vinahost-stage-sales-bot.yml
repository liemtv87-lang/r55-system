name: KQ247 Sales Bot VPS Non-Production Stage
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-stage-sales-bot.yml
      - deployment/sales-bot/**
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate the complete sales bot bundle locally
        run: |
          set -euo pipefail
          cd deployment/sales-bot
          node --check worker.mjs
          node --check payos-orders.mjs
          node --check confirm-payos.mjs
          npm install --omit=dev --no-audit --no-fund
          npm test
          node --input-type=module -e "import {PayOS} from '@payos/node';if(typeof PayOS!=='function')process.exit(1);console.log('PAYOS_SDK_IMPORT=PASS')"
      - name: Install SSH utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Stage isolated inactive build without production credentials or Telegram polling
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          host=root@64.120.92.172
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$host" "mkdir -p /opt/kq247/sales-stage && chmod 700 /opt/kq247/sales-stage"
          sshpass -e scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 deployment/sales-bot/worker.mjs deployment/sales-bot/payos-orders.mjs deployment/sales-bot/confirm-payos.mjs deployment/sales-bot/package.json deployment/sales-bot/Dockerfile "$host":/opt/kq247/sales-stage/
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 "$host" 'bash -se' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 8 http://127.0.0.1:18087/healthz >/dev/null
          cd /opt/kq247/sales-stage
          docker build --quiet -t kq247/sales-bot-stage:latest . >/dev/null
          if docker ps -a --format '{{.Names}}' | grep -qx kq247-sales-bot-stage; then
            docker rm -f kq247-sales-bot-stage >/dev/null
          fi
          docker run -d --name kq247-sales-bot-stage --restart unless-stopped --network bridge -e KQ247_SALES_BOT_ACTIVE=0 kq247/sales-bot-stage:latest >/dev/null
          sleep 5
          docker exec kq247-sales-bot-stage node -e 'fetch("http://127.0.0.1:3032/healthz").then(r=>r.json()).then(j=>{if(!j.ok||j.active||j.tokenConfigured||j.databaseConfigured||j.payos.ready)process.exit(1);console.log("KQ247_SALES_STAGE_HEALTH=PASS")}).catch(()=>process.exit(1))'
          docker exec kq247-sales-bot-stage node -e 'const fs=require("fs"); const s=fs.readFileSync("/app/worker.mjs","utf8"); for(const k of ["MỞ TOOL BÓNG ĐÁ","MỞ BẢN KHÁCH XỔ SỐ","MUA TOOL VIETLOTT","6 THÁNG","SAO CHÉP MÃ","SAO CHÉP LINK","createPayosCheckout","processPayosWebhook"]){if(!s.includes(k))process.exit(1)}console.log("KQ247_SALES_STAGE_FEATURES=PASS")'
          curl -fsS --max-time 8 http://127.0.0.1:18087/healthz | python3 -c 'import json,sys;j=json.load(sys.stdin); assert j["ok"] and j["active"] is True; print("KQ247_EXISTING_LIVE_BOT_UNCHANGED=PASS")'
          REMOTE
