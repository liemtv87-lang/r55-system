name: KQ247 VPS Client and Customer Code Safety
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-client-sales-compat-smoke.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify all official VPS entrypoints are reachable and client entrypoints retain authentication
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          origin="https://64-120-92-172.sslip.io"
          checks=[
            ("lottery_main_mb",origin+"/xoso?region=xsmb",["XSMB"]),
            ("lottery_main_mt",origin+"/xoso?region=xsmt",["XSMT"]),
            ("lottery_main_mn",origin+"/xoso?region=xsmn",["XSMN"]),
            ("lottery_client",origin+"/xoso-khach?region=xsmb",["kq247_lottery_code","kq247_dev","kq247auth.compute"]),
            ("football_main",origin+"/",["KQ247"]),
            ("football_client",origin+"/client.html",["KQ247"])
          ]
          for label,url,markers in checks:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'KQ247-Client-Smoke/1.0'}),timeout=25) as r:
              body=r.read(1200000).decode('utf-8','replace')
              assert r.status==200, (label,r.status)
              assert all(x.lower() in body.lower() for x in markers),label
              print("VPS_"+label.upper()+"=PASS; bytes="+str(len(body)))
          print("KQ247_VPS_CLIENT_MAIN_STATUS=PASS")
          PY
