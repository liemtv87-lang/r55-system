name: KQ247 Sales Live Checkout Smoke Test
on:
  push:
    paths:
      - .github/workflows/kq247-sales-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check live Telegram owner, real PayOS checkout and DB without payment
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 10 http://127.0.0.1:18087/healthz |
            python3 -c 'import json,sys;x=json.load(sys.stdin);assert x.get("active") and x.get("lastPoll") and not x.get("lastError");print("TELEGRAM_BOT_VPS_LIVE=YES")'
          for i in $(seq 1 18); do
            if docker exec kq247-sales-bot-primary node -e 'const f=require("fs");process.exit(f.readFileSync("/app/worker.mjs","utf8").includes("sales_checkout_intents")?0:1)'; then break; fi
            sleep 10
          done
          docker exec kq247-sales-bot-primary node -e 'const f=require("fs");if(!f.readFileSync("/app/worker.mjs","utf8").includes("sales_checkout_intents"))process.exit(2);console.log("TICKET_BRIDGE_VPS_CODE=READY")'
          docker exec -i kq247-sales-bot-primary node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import pg from 'pg';
          const token=process.env.TELEGRAM_SALES_BOT_TOKEN;
          if(!token)throw Error('telegram_token_missing');
          const me=await fetch('https://api.telegram.org/bot'+token+'/getMe',{signal:AbortSignal.timeout(20000)}).then(r=>r.json());
          if(!me.ok||me.result?.username!=='muatool_du_doan_bot')throw Error('unexpected_telegram_bot');
          console.log('TELEGRAM_GETME_CORRECT_BOT=PASS');
          const ticket=crypto.randomBytes(32).toString('hex');
          const ticketHash=crypto.createHash('sha256').update(ticket).digest('hex');
          const db=new pg.Pool({connectionString:process.env.NEON_DATABASE_URL,max:1,connectionTimeoutMillis:12000});
          await db.query('INSERT INTO public.sales_checkout_intents(ticket_hash,telegram_user_id,product,duration_days) VALUES($1,$2,$3,$4)',[ticketHash,'0','lottery',30]);
          const body=JSON.stringify({ticket,telegramUserId:'0',product:'lottery',days:30});
          const result=await fetch('https://tool-sales-bot.onrender.com/sales/checkout',{method:'POST',
             headers:{'content-type':'application/json'},body,signal:AbortSignal.timeout(110000)});
          if(!result.ok)throw Error('bridge_checkout_http_'+result.status);
          const order=await result.json();
          if(Number(order.amount)!==1500000||new URL(order.checkoutUrl).protocol!=='https:')throw Error('bridge_checkout_wrong_amount');
          try{
            const q=await db.query('SELECT state,price_vnd FROM public.sales_payos_orders WHERE order_code=$1 AND telegram_user_id=$2 LIMIT 1',[String(order.orderCode),'0']);
            if(q.rows[0]?.state!=='checkout_ready'||Number(q.rows[0]?.price_vnd)!==1500000)throw Error('checkout_order_not_persisted');
          }finally{await db.end();}
          console.log('PAYOS_REAL_CHECKOUT_LINK_CREATED=PASS');
          console.log('PAYOS_AMOUNT_1500000_VND=PASS');
          console.log('NEON_ORDER_STORED_WITHOUT_PAYMENT=PASS');
          console.log('PAYMENT_EXECUTED=NO');
          JS
          REMOTE
