name: KQ247 TGFinder One-Time Owner Submission
on:
  push:
    branches:
      - ops/backlink-entrypoints-20261014
    paths:
      - .github/workflows/kq247-tgfinder-once-20261014.yml
permissions:
  contents: write
jobs:
  submit-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Submit at most one truthful listing per group
        run: python3 seo-vps/tgfinder-one-time-submit-20261014.py
      - name: Keep receipts on branch for deduplication
        if: always()
        run: |
          if [ -f reports/kq247-tgfinder-once-20261014.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/kq247-tgfinder-once-20261014.json
            if ! git diff --cached --quiet; then
              git commit -m "Record one-time TGFinder submission receipts [skip ci]"
              git push origin HEAD:ops/backlink-entrypoints-20261014
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kq247-tgfinder-submission-receipts
          path: reports/kq247-tgfinder-once-20261014.json
          retention-days: 14
