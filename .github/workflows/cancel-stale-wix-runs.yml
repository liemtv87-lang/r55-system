name: Cancel stale Wix deploy runs
on:
  push:
    paths:
      - '.github/workflows/cancel-stale-wix-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale runs
        run: |
          set -euo pipefail
          for id in 36886984203 36887150649; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" || true
          done
