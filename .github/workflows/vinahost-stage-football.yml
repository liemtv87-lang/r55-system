name: Deploy R55 VPS Staging Proxy
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-stage-football.yml
      - deployment/football-staging/**
      - deployment/football-native/**
      - deployment/football-original/**
      - deployment/football-history/**
      - deployment/football-bots/**
permissions:
  contents: read
concurrency:
  group: kq247-vps-r55-staging
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH transfer helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Copy isolated staging files
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          tar -czf /tmp/kq247-r55-stage.tgz deployment/football-staging deployment/football-native deployment/football-original deployment/football-history deployment/football-bots
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'mkdir -p /opt/kq247'
          sshpass -e scp -o StrictHostKeyChecking=accept-new /tmp/kq247-r55-stage.tgz root@64.120.92.172:/tmp/kq247-r55-stage.tgz
      - name: Execute on-VPS deployment script and verify native R55
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh -n -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            root@64.120.92.172 \
            'tar -xzf /tmp/kq247-r55-stage.tgz -C /opt/kq247 && bash /opt/kq247/deployment/football-staging/deploy.sh'
