name: KQ247 VPS Bot Secret Preflight
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-r55-bot-secret-preflight.yml
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Report only whether VPS migration bot credentials are configured
        env:
          GROUP_TOKEN: ${{ secrets.R55_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_GROUP_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          SALES_TOKEN: ${{ secrets.SALES_BOT_TOKEN || secrets.TELEGRAM_SALES_BOT_TOKEN || secrets.KQ247_SALES_BOT_TOKEN }}
          SALES_API: ${{ secrets.KQ247_SALES_API_SECRET || secrets.SALES_BOT_API_KEY }}
          SSH_AVAILABLE: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          [ -n "$GROUP_TOKEN" ] && echo 'VPS_GROUP_BOT_TOKEN=PRESENT' || echo 'VPS_GROUP_BOT_TOKEN=MISSING'
          [ -n "$SALES_TOKEN" ] && echo 'VPS_SALES_BOT_TOKEN=PRESENT' || echo 'VPS_SALES_BOT_TOKEN=MISSING'
          [ -n "$SALES_API" ] && echo 'VPS_SALES_API_SECRET=PRESENT' || echo 'VPS_SALES_API_SECRET=MISSING'
          [ -n "$SSH_AVAILABLE" ] && echo 'VPS_SSH_CREDENTIAL=PRESENT' || echo 'VPS_SSH_CREDENTIAL=MISSING'
