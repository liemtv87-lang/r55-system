name: XSMB Three Causal Families 500 Holdout
on:
  push:
    paths: ['.github/workflows/xsmb-three-causal-families-20261013.yml','research/xsmb_three_causal_families_20261013.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [contrarian, bridges, seasonal, mixed]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_three_causal_families_20261013.py ${{ matrix.mode }}
