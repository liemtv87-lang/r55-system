name: VinaHost VPS SSH Probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-ssh-probe.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify encrypted VPS secret is configured
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::GitHub Actions secret VPS_ROOT_PASSWORD has not been configured."
            exit 1
          fi
          echo "Encrypted SSH credential is configured."
      - name: Install SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Verify VinaHost machine and resources (read only)
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -eu
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=15 \
            -o LogLevel=ERROR \
            root@64.120.92.172 \
            'echo KQ247_VPS_CONNECTED=yes; printf "HOSTNAME="; hostname; echo "OPERATING_SYSTEM:"; cat /etc/os-release | head -n 3; printf "CPU_THREADS="; nproc; echo "MEMORY:"; free -h; echo "DISK:"; df -h /; printf "DOCKER_PATH="; command -v docker || true'
