name: XS Region Public Check
on:
  push:
    paths: ['.github/workflows/region-public-check.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify three public XS menus plus customer region and station
        run: |
          set -euo pipefail
          ROOT=https://64-120-92-172.sslip.io
          for region in xsmb xsmt xsmn; do
            end=$(curl -fsSL --max-time 20 -o /tmp/xs-main.html -w '%{url_effective}' "$ROOT/?region=$region&station=TEST")
            echo "MAIN_REGION_$region=$end"
            test "$end" = "$ROOT/xoso?region=$region&station=TEST"
            grep -q 'BẢN CHÍNH xổ số ba miền' /tmp/xs-main.html
            code=$(curl -fsSL --max-time 20 -o /tmp/xs-client.html -w '%{http_code}' "$ROOT/xoso-khach?region=$region")
            test "$code" = 200
            grep -q 'kq247_lottery_code' /tmp/xs-client.html
            grep -q 'data-region="xsmn"' /tmp/xs-client.html
            echo "CLIENT_REGION_$region=PASS"
          done
          curl -fsSL --max-time 20 "$ROOT/" -o /tmp/football-home.html
          grep -q 'Soi kèo bóng đá' /tmp/football-home.html
          echo XS_ROOT_REGION_AND_CLIENT=PASS
