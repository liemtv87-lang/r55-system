name: KQ247 One-Time Submission Entrypoint Audit
on:
  push:
    branches:
      - ops/backlink-entrypoints-20261014
    paths:
      - .github/workflows/kq247-entrypoints-once-20261014.yml
permissions:
  contents: write
jobs:
  audit:
    if: github.ref == 'refs/heads/ops/backlink-entrypoints-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect real directory submission endpoints once (read only)
        run: python3 seo-vps/submit-entrypoint-once-20261014.py
      - name: Persist evidence to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kq247-submission-entrypoints-20261014.json
          if ! git diff --cached --quiet; then
            git commit -m "Record one-time directory submission form audit [skip ci]"
            git push origin HEAD:ops/backlink-entrypoints-20261014
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kq247-one-time-entrypoint-audit
          path: reports/kq247-submission-entrypoints-20261014.json
          retention-days: 14
