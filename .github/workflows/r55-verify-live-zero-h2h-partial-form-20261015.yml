name: R55 Verify Live H2H Optional and Partial Form on VPS
on:
  push:
    branches:
      - r55-bongdalu-deep-history-20261015
    paths:
      - .github/workflows/r55-verify-live-zero-h2h-partial-form-20261015.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Audit real R55 VPS without restart, publication or snapshot rewrite
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 root@64.120.92.172 \
            'cd /opt/kq247/deployment/football-staging && docker compose exec -T football-native node --input-type=module' <<'JS'
          import {db} from 'hatchable';
          import {resolveBongdaluBase,getBongdaluText,verifiedBongdaluInternals as V} from './lib/bongdaluR55.js';
          const source=await resolveBongdaluBase();
          const xmls=await Promise.all(V.BOOKS.map(async ([name,id])=>({name,id,text:await getBongdaluText(source.base,'gf/data/odds/en/goal'+id+'.xml','text/xml',12000).catch(()=>'')})));
          const all=V.parseFeed(source.js,V.parseOdds(xmls));
          const ids=['3102824','3102993'],proof=[];
          for (const id of ids){
            const m=all.find(x=>x.bongdaluId===id);
            if (!m){proof.push({id,notInLatestFeed:true});continue}
            const h=await V.history(source.base,id,m.ts);
            const pick=h?V.makeMarket(m,h,[]):null;
            proof.push({id,league:m.league,home:m.home,away:m.away,formHome:h?.home?.n||0,formAway:h?.away?.n||0,h2h:h?.h2h?.n||0,hasOdds:!!m.market,recovery:h?.sourceCoverage?.teamScheduleRecovery||{},modeled:!!pick,researchOnly:pick?.market?.researchOnly,reason:pick?.market?.filterReason,market:pick?.market?.type,pick:pick?.market?.pick});
          }
          const day=V.vnDay();
          const q=await db.query('SELECT scope,updated_at,payload->\'scanProgress\' AS progress FROM football_compact_stats WHERE scope=$1',['r55_native_preview_'+day]);
          console.log('R55_POST_FIX_TARGETED',JSON.stringify({day,source:source.base,proof,preview:q.rows}));
          const inFeed=proof.filter(x=>!x.notInLatestFeed&&x.hasOdds);
          if(inFeed.some(x=>!x.modeled))throw Error('post_patch_unmodeled_fixture');
          JS

