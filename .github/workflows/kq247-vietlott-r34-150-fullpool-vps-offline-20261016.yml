name: KQ247 Vietlott R34 150 draws Full Pool VPS Offline Test
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r34-150-fullpool-vps-offline-20261016.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kq247-r34-150-offline-only
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client
      - name: Verify private R34 150-draw source and all offline tests on VPS without touching live services
        shell: bash
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SSHPASS:-}"
          install -d -m 0700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          expected=88642358bb029c7134f18efa914b76c8dadc92ed
          key=/opt/kq247/ops/deploy/keys/vietlott_ro_ed25519
          known=/opt/kq247/ops/deploy/keys/github_known_hosts
          test -s "$key" && test -s "$known"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o ConnectTimeout=15"
          before=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          tmp=$(mktemp -d /opt/kq247/vietlott/versions/.r34-150-offline-XXXXXX)
          trap 'rm -rf "$tmp"' EXIT
          GIT_TERMINAL_PROMPT=0 git clone --quiet --single-branch --branch main git@github.com:liemtv87-lang/vietlott-auto-hoc.git "$tmp/source"
          sha=$(git -C "$tmp/source" rev-parse HEAD)
          test "$sha" = "$expected"
          echo "KQ247_R34_150_SOURCE_SHA=$sha"
          docker run --rm --network none --cpus=2 --memory=3g -v "$tmp/source":/work:ro -w /work --entrypoint sh node:22-bookworm -ec '
            set -eu
            for file in vietlott-vps-server.mjs scripts/engine.mjs scripts/update-data.mjs scripts/needs-repair.mjs scripts/backtest-60-shard.mjs scripts/merge-backtest-60.mjs scripts/vps-release-gate.mjs; do node --check "$file"; done
            echo KQ247_R34_150_SYNTAX=PASS
            node scripts/r34-full-primary-contract.test.mjs
            node scripts/r35-contract.test.mjs
            node scripts/xsmb-verified-daily.mjs
            node scripts/region-completeness.test.mjs
            node test.mjs
            node test-daily.mjs
            node test-export.mjs
            node test-snapshot.mjs
            node scripts/reduce-coverage.test.mjs
            node scripts/verify-fast-pool-filter.mjs
            echo KQ247_R34_150_OFFLINE_SUITE=PASS
          '
          after=$(docker ps --format '{{.Names}}|{{.ID}}' | sort)
          test "$before" = "$after"
          echo KQ247_R34_150_RUNNING_CONTAINERS_UNCHANGED=YES
          echo KQ247_R34_150_PRODUCTION_CUTOVER=NOT_PERFORMED
          VPS
