name: KQ247 XS VPS database preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kq247-xs-vps-database-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Check VPS database and staging without modification
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 12 -t ed25519 64.120.92.172 > "$HOME/.ssh/known_hosts"
          ssh-keygen -lf "$HOME/.ssh/known_hosts" | grep -Fq 'SHA256:Nl+BE+S3rt6wgoh4Q9IaSRejLzPtN0/0lHL46iKYirg'
          sshpass -e ssh -T -o StrictHostKeyChecking=yes root@64.120.92.172 'bash -se' <<'VPS'
          set -euo pipefail
          echo PRECHECK_UTC; date -u '+%F %T'
          echo STAGED_FILES
          find /opt/kq247/lottery-daily-staging -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo LOCAL_PG_IDENTITY
          docker exec kq247-r55-postgres sh -c 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT current_database(),current_user,version();"'
          echo LOCAL_PG_TABLES
          docker exec kq247-r55-postgres sh -c 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT schemaname||chr(46)||tablename FROM pg_tables WHERE schemaname = chr(112)||chr(117)||chr(98)||chr(108)||chr(105)||chr(99) ORDER BY tablename LIMIT 45;"'
          echo LOCAL_SCHEMAS
          docker exec kq247-r55-postgres sh -c 'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT schema_name FROM information_schema.schemata WHERE schema_name LIKE '''kq247%''' ORDER BY 1;"'
          echo VPS_DISK
          df -h /opt/kq247 | tail -1
          echo PUBLIC_CURRENT_UI
          curl -sfS -m 8 http://127.0.0.1:18084/healthz | python3 -c 'import json,sys; j=json.load(sys.stdin);print({k:j.get(k) for k in ("ok","neonOriginalReadThrough","backendMigrated","lastError")})'
          echo XS_VPS_PREFLIGHT_COMPLETE
          VPS