name: KQ247 station-source offline unit tests
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kq247-station-source-offline-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check deployment/lottery-vps-daily-staging/minhngoc-all-stations.mjs
          node --check deployment/lottery-vps-daily-staging/station-previous-draw-runner.mjs
          node --check deployment/lottery-vps-daily-staging/multi-station-locked-reader.mjs
      - name: 35 independent source station unit proofs
        run: node deployment/lottery-vps-daily-staging/station-source-tests.mjs
