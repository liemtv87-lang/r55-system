name: XSMB Three-Lotto Conditional Hazard Four Models
on:
  push:
    paths: ['.github/workflows/xsmb-three-conditional-hazard-20261013.yml','research/xsmb_three_conditional_hazard_20261013.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [hazard, gap, headtail, hybrid]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet numpy
      - run: python3 research/xsmb_three_conditional_hazard_20261013.py ${{ matrix.mode }}
