name: VPS Xo So Telegram Credential Availability
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vinahost-xs-telegram-credential-preflight.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials without revealing token
        env:
          XS_TOKEN: ${{ secrets.TELEGRAM_LOTTERY_BOT_TOKEN || secrets.XS_BOT_TOKEN }}
          SSH_PASSWORD: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$SSH_PASSWORD" ] && echo "VPS_SSH_AVAILABLE=YES" || echo "VPS_SSH_AVAILABLE=NO"
          [ -n "$XS_TOKEN" ] && echo "XS_TELEGRAM_TOKEN_AVAILABLE=YES" || echo "XS_TELEGRAM_TOKEN_AVAILABLE=NO"
          if [ -n "$XS_TOKEN" ]; then
            python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          t=os.getenv('XS_TOKEN')
          try:
            r=urllib.request.urlopen('https://api.telegram.org/bot'+t+'/getMe',timeout=10)
            d=json.load(r)
            print('XS_TELEGRAM_TOKEN_VALID='+('YES' if d.get('ok') else 'NO'))
            if d.get('ok'):
              user=d['result']
              print('XS_TELEGRAM_BOT_USERNAME='+str(user.get('username','')))
              from urllib.parse import urlencode
              args=urlencode({'chat_id':'-1004320899120','user_id':str(user['id'])})
              r=urllib.request.urlopen('https://api.telegram.org/bot'+t+'/getChatMember?'+args,timeout=10)
              j=json.load(r)
              status=j.get('result',{}).get('status','none')
              print('XS_GROUP_MEMBERSHIP='+status)
              print('XS_GROUP_ADMIN_CONFIRMED='+('YES' if j.get('ok') and status in ('administrator','creator') else 'NO'))
          except Exception: print('XS_TELEGRAM_TOKEN_VALID=NO')
          PY
          fi
