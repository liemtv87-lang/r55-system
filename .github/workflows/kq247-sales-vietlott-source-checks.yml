name: KQ247 Sales Legacy and Vietlott Source Checks
on:
  push:
    paths:
      - .github/workflows/kq247-sales-vietlott-source-checks.yml
      - deployment/sales-bot/worker.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check active sales-bot source and latest client-only link resolver
        run: |
          set -euo pipefail
          node --check deployment/sales-bot/worker.mjs
          grep -q 'function legacyProduct' deployment/sales-bot/worker.mjs
          grep -q 'function sendLatestClient' deployment/sales-bot/worker.mjs
          grep -q 'sales_link_history' deployment/sales-bot/worker.mjs
          echo SALES_LEGACY_LINK_SOURCE=PASS
# Vietlott source is in a separate PRIVATE repo. Cross-repo clone without a
# dedicated read credential is intentionally not attempted here.
