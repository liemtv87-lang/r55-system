name: KQ247 Vietlott R40 Boot Failure Diagnosis
on:
  push:
    paths:
      - .github/workflows/kq247-vietlott-r40-diagnose.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read VPS Docker restart and kernel OOM clues (no changes)
        env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          sshpass -e ssh -T -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@64.120.92.172 'bash -se' <<'REMOTE'
          set -euo pipefail
          name=kq247-vietlott-vps
          echo VPS_VIETLOTT_NOW
          curl -fsS --max-time 15 http://127.0.0.1:18088/health || true
          echo
          echo VPS_VIETLOTT_RESOURCE_USAGE
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' "$name" || true
          docker inspect --format 'RUNNING={{.State.Running}} OOM={{.State.OOMKilled}} EXIT={{.State.ExitCode}} RESTARTS={{.RestartCount}} IMAGE={{.Config.Image}}' "$name"
          echo R40_RESTART_LOG_TAIL
          docker logs --since '2026-10-12T22:09:00Z' "$name" 2>&1 | grep -iE 'error|exception|fatal|killed|heap|exit|listening|backtest|start|auth|oom|snapshot|r40' | tail -90 | cut -c 1-230 || true
          echo SYSTEM_KERNEL_OOM
          journalctl -k --since '2026-10-12 22:09:00' --until '2026-10-12 22:13:00' --no-pager 2>/dev/null | grep -i -E 'out of memory|oom|killed process' | tail -15 || true
          REMOTE
