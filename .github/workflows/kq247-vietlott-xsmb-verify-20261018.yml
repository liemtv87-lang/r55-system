name: KQ247 Vietlott XSMB two-source proof October 18
on:
  push:
    branches: [main]
    paths: [.github/workflows/kq247-vietlott-xsmb-verify-20261018.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parser self-test and dated independent-source proof
        shell: bash
        run: |
          set -euo pipefail
          node deployment/vietlott/xsmb-verified-daily.mjs
          node deployment/vietlott/xsmb-verified-daily.mjs 2026-10-17
