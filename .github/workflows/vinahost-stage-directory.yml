name: Create KQ247 Staging Directory
on:
  push:
    paths:
      - .github/workflows/vinahost-stage-directory.yml
permissions:
  contents: read
jobs:
  create-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - env:
          SSHPASS: ${{ secrets.VPS_ROOT_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new root@64.120.92.172 'mkdir -p /opt/kq247/football /opt/kq247/xoso /opt/kq247/vietlott /opt/kq247/customers /opt/kq247/bots /opt/kq247/seo /opt/kq247/backups /opt/kq247/infrastructure /opt/kq247/logs && ls -l /opt/kq247'
