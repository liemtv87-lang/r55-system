version: 2.1
# KQ247 Telegram sending moved permanently to the VinaHost VPS.
# CircleCI is a validation-only source; no pipeline parameter can send a message.
jobs:
  xs_preflight:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate lottery code without Telegram credentials
          command: |
            set -eu
            python -m py_compile lottery-bot/sender.py
            echo "KQ247_LEGACY_CIRCLECI_SENDER_DISABLED=YES"
workflows:
  xs_validation:
    jobs:
      - xs_preflight
