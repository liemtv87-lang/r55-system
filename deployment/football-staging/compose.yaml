services:
  football-db:
    image: postgres:17-alpine
    container_name: kq247-r55-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: r55
      POSTGRES_USER: r55app
      POSTGRES_PASSWORD: ${R55_DB_PASSWORD:?required}
    volumes:
      - football-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r55app -d r55"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  football-cache:
    build:
      context: .
      dockerfile: Dockerfile
    image: kq247/r55-public-cache:local
    container_name: kq247-football-cache
    restart: unless-stopped
    read_only: true
    volumes:
      - football-cache-data:/cache
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    pids_limit: 100
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
  football-native:
    build:
      context: ../football-native
      dockerfile: Dockerfile
    image: kq247/r55-native:local
    container_name: kq247-football-native
    restart: unless-stopped
    depends_on:
      football-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://r55app:${R55_DB_PASSWORD}@football-db:5432/r55
      NATIVE_MIN_DAY: "2026-10-13"
      NODE_ENV: production
    read_only: true
    volumes:
      - football-native-data:/data
    tmpfs:
      - /tmp:size=32m
    mem_limit: 1024m
    pids_limit: 200
    cpus: "1.5"
    security_opt:
      - no-new-privileges:true
  # Original source is executed in an isolated read-only test service.
  # Not yet a customer or Telegram cutover.
  football-original:
    build:
      context: ..
      dockerfile: football-original/Dockerfile.vps
    image: kq247/r55-original:local
    container_name: kq247-football-original
    restart: unless-stopped
    depends_on:
      football-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://r55app:${R55_DB_PASSWORD}@football-db:5432/r55
      NODE_ENV: production
    ports:
      - "127.0.0.1:18081:3002"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 384m
    pids_limit: 120
    cpus: "0.60"
    security_opt:
      - no-new-privileges:true
  # Standby: full bot logic runs on VPS but cannot send while Hatchable is owner.
  # Cut over only once bot credentials and deduplication/old scheduler shutdown verified.
  football-group-bot:
    build:
      context: ..
      dockerfile: football-bots/Dockerfile
    image: kq247/r55-group-bot:local
    container_name: kq247-r55-group-bot
    restart: unless-stopped
    depends_on:
      football-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://r55app:${R55_DB_PASSWORD}@football-db:5432/r55
      R55_VPS_GROUP_BOT_ACTIVE: "0"
      NODE_ENV: production
    ports:
      - "127.0.0.1:18083:3030"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 192m
    pids_limit: 100
    cpus: "0.35"
    security_opt:
      - no-new-privileges:true
  football-preview:
    image: kq247/r55-native:local
    container_name: kq247-football-preview
    restart: unless-stopped
    depends_on:
      football-db:
        condition: service_healthy
      football-native:
        condition: service_started
    environment:
      DATABASE_URL: postgres://r55app:${R55_DB_PASSWORD}@football-db:5432/r55
      NODE_ENV: production
    command: ["/bin/sh","-c","while true; do node worker.mjs model-batch || echo R55_PREVIEW_RETRY_NEXT_CYCLE; sleep 14400; done"]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    pids_limit: 140
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
  # Read-through of original live Neon HTML; no new prediction algorithm or snapshot writes.
  lottery-original:
    build:
      context: ..
      dockerfile: lottery-original/Dockerfile
    image: kq247/lottery-original-ui:local
    container_name: kq247-lottery-original
    restart: unless-stopped
    ports:
      - "127.0.0.1:18084:3004"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    pids_limit: 100
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
  # Original GitHub sender runs on VPS; disabled until a verified single-sender cutover.
  lottery-bot:
    build:
      context: ..
      dockerfile: lottery-original/bot/Dockerfile
    image: kq247/lottery-original-telegram:local
    container_name: kq247-lottery-bot
    restart: unless-stopped
    env_file:
      - /opt/kq247/.bot-secrets/xs.env
    environment:
      DRY_RUN: "0"
      KQ247_LOTTERY_CUTOVER: "enabled"
      NODE_ENV: production
    ports:
      - "127.0.0.1:18085:3005"
    volumes:
      - lottery-bot-ledger:/app/lottery-bot/state
      - lottery-bot-git:/app/.git
      - lottery-bot-state:/data
    mem_limit: 192m
    pids_limit: 100
    cpus: "0.35"
    security_opt:
      - no-new-privileges:true
  football-staging:
    image: caddy:2.10-alpine
    container_name: kq247-football-staging
    restart: unless-stopped
    depends_on:
      - football-cache
      - football-original
      - lottery-original
    ports:
      - "127.0.0.1:18080:18080"
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../football-original/public:/srv:ro
      - football-caddy-data:/data
      - football-caddy-config:/config
    mem_limit: 256m
    pids_limit: 100
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
volumes:
  football-native-data:
  football-db-data:
  football-cache-data:
  football-caddy-data:
  football-caddy-config:
  lottery-bot-ledger:
  lottery-bot-git:
  lottery-bot-state:
