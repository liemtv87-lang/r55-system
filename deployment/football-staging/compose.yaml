services:
  football-db:
    image: postgres:17-alpine
    container_name: kq247-r55-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: r55
      POSTGRES_USER: r55app
      POSTGRES_PASSWORD: ${R55_DB_PASSWORD:?required}
    volumes:
      - football-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    shm_size: 128mb
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r55app -d r55"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  football-cache:
    build:
      context: .
      dockerfile: Dockerfile
    image: kq247/r55-public-cache:local
    container_name: kq247-football-cache
    restart: unless-stopped
    read_only: true
    volumes:
      - football-cache-data:/cache
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    pids_limit: 100
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
  football-staging:
    image: caddy:2.10-alpine
    container_name: kq247-football-staging
    restart: unless-stopped
    depends_on:
      - football-cache
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    mem_limit: 256m
    pids_limit: 100
    cpus: "0.50"
    security_opt:
      - no-new-privileges:true
volumes:
  football-db-data:
  football-cache-data:
